<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifless — Gestionale per carrozzerie</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0A0B0D; color: #F3F1EC; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; font-weight: 700; font-size: 20px; }
  .brand img { width: 30px; height: 30px; border-radius: 7px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 14.5px; color: #C4C8D0; line-height: 1.6; margin: 0 0 28px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 11px 20px; border-radius: 8px; text-decoration: none;
    font-size: 14px; font-weight: 600;
  }
  a.btn.primary { background: #2F80ED; color: #fff; }
  a.btn.secondary { background: transparent; color: #C4C8D0; border: 1px solid #2A2D33; }
  .footer { margin-top: 40px; font-size: 12px; color: #6B7078; }
  .footer a { color: #6B7078; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/logo-icon.png" alt="Rifless"> Rifless</div>
    <h1>Il gestionale per carrozzerie</h1>
    <p>Preventivi, ricambi, appuntamenti, comunicazioni cliente e molto altro in un unico posto.</p>
    <div class="links">
      <a class="btn primary" href="/portale">Portale cliente</a>
      <a class="btn secondary" href="mailto:info@rifless.it">Contattaci</a>
    </div>
    <div class="footer">
      <a href="/privacy">Privacy</a> · <a href="/termini">Termini</a> · <a href="/cookie">Cookie</a>
    </div>
  </div>
</body>
</html>
