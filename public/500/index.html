<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifless — Errore imprevisto</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0A0B0D; color: #F3F1EC; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px; text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; font-weight: 700; font-size: 18px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; }
  .codice { font-size: 13px; letter-spacing: 2px; color: #6B7078; margin-bottom: 8px; }
  h1 { font-size: 21px; margin: 0 0 12px; }
  p { font-size: 14px; color: #C4C8D0; line-height: 1.6; margin: 0 0 24px; }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; background: #2F80ED; color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/logo-icon.png" alt="Rifless"> Rifless</div>
    <div class="codice">ERRORE 500</div>
    <h1>Qualcosa è andato storto</h1>
    <p>Si è verificato un errore imprevisto. Riprova tra qualche istante; se il problema persiste, contattaci.</p>
    <a class="btn" href="/">Torna alla home</a>
  </div>
</body>
</html>
