<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ombra CRM — Stato veicolo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #FAF9F6; color: #1B1A17;
  }
  .card {
    background: #fff; border: 1px solid #E7E4DC; border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .targa { font-family: monospace; font-size: 12px; background: #F1EFE8; display: inline-block; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; }
  .cliente { font-size: 13px; color: #8A867C; margin-bottom: 20px; }
  h2 { font-size: 13px; font-weight: 700; margin: 0 0 12px; }
  .stage-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; background: #1B1A1722; }
  .timeline-item { display: flex; gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #F1EFE8; }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-data { color: #8A867C; font-size: 12px; white-space: nowrap; }
  .foto-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .foto-grid img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid #E7E4DC; }
  .stato-msg { text-align: center; color: #8A867C; font-size: 14px; padding: 40px 20px; }
  .errore { background: #FBEAE5; color: #B4472E; padding: 14px; border-radius: 10px; font-size: 14px; }
</style>
</head>
<body>

<div id="app" class="stato-msg">Caricamento…</div>

<script>
async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("t");
  const app = document.getElementById("app");

  if (!token) {
    app.className = "errore";
    app.textContent = "Link non valido: manca il codice di accesso.";
    return;
  }

  try {
    const res = await fetch(`/api/portale/${token}`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || "Link non valido o scaduto.");
    }
    const data = await res.json();
    render(data);
  } catch (e) {
    app.className = "errore";
    app.textContent = e.message;
  }
}

function render(data) {
  const { veicolo, cliente, foto, storicoStage, preventivo } = data;

  const STAGE_LABELS = {
    ACCETTAZIONE: "Accettazione", PREVENTIVO: "Preventivo", ATTESA_APPROVAZIONE: "In attesa di approvazione",
    ORDINE_RICAMBI: "Ordine ricambi", IN_LAVORAZIONE: "In lavorazione", PREPARAZIONE: "Preparazione",
    VERNICIATURA: "Verniciatura", LUCIDATURA: "Lucidatura", CONTROLLO_QUALITA: "Controllo qualità",
    LAVAGGIO: "Lavaggio", PRONTA_CONSEGNA: "Pronta per la consegna", CONSEGNATA: "Consegnata",
  };

  let html = `
    <div class="card">
      <div class="targa">${veicolo.targa}</div>
      <h1>${veicolo.marca} ${veicolo.modello}</h1>
      <div class="cliente">${cliente?.nome || ""} ${cliente?.cognome || ""}</div>
      <span class="stage-badge">${STAGE_LABELS[veicolo.stage] || veicolo.stage}</span>
      ${veicolo.dataPrevistaConsegna ? `<div style="margin-top:10px;font-size:13px;color:#8A867C;">Consegna prevista: ${new Date(veicolo.dataPrevistaConsegna).toLocaleDateString("it-IT")}</div>` : ""}
    </div>
  `;

  if (storicoStage && storicoStage.length > 0) {
    html += `<div class="card"><h2>Avanzamento lavorazione</h2>`;
    storicoStage.forEach((s) => {
      html += `
        <div class="timeline-item">
          <div class="timeline-data">${new Date(s.changedAt).toLocaleDateString("it-IT")}</div>
          <div>${STAGE_LABELS[s.toStage] || s.toStage}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  if (foto && foto.length > 0) {
    html += `<div class="card"><h2>Foto</h2><div class="foto-grid">`;
    foto.forEach((p) => {
      html += `<img src="${p.url}" alt="Foto veicolo" />`;
    });
    html += `</div></div>`;
  }

  if (preventivo) {
    html += `
      <div class="card">
        <h2>Preventivo</h2>
        <div style="font-size:20px;font-weight:700;">€ ${Number(preventivo.totale).toFixed(2)}</div>
        <div style="font-size:12px;color:#8A867C;margin-top:4px;">Stato: ${preventivo.stato}</div>
      </div>
    `;
  }

  document.getElementById("app").className = "";
  document.getElementById("app").innerHTML = html;
}

init();
</script>
</body>
</html>
