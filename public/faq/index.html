<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifless — Domande frequenti</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0A0B0D; color: #F3F1EC;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; font-weight: 700; font-size: 16px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p.intro { font-size: 14px; color: #A8A29B; line-height: 1.55; margin: 0 0 28px; }
  .voce { border: 1px solid #2A2E34; border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: #15171B; }
  .domanda { width: 100%; text-align: left; background: none; border: none; color: #F3F1EC; font-size: 15px; font-weight: 600; padding: 16px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .domanda .segno { color: #8D9099; font-size: 18px; flex-shrink: 0; transition: transform 0.15s; }
  .voce.aperta .segno { transform: rotate(45deg); }
  .risposta { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .risposta-interna { padding: 0 18px 16px; font-size: 14px; color: #C4C8D0; line-height: 1.6; }
  .stato { text-align: center; color: #6B6963; font-size: 13.5px; padding: 40px 0; }
  .suggerimento { text-align: center; margin-top: 32px; font-size: 13px; color: #6B6963; }
  .suggerimento a { color: #2F80ED; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/logo-icon.png" alt="Rifless"> Rifless</div>
    <h1>Domande frequenti</h1>
    <p class="intro">Le risposte riflettono come funziona davvero il gestionale oggi.</p>
    <div id="lista"><div class="stato">Caricamento…</div></div>
    <p class="suggerimento">Non hai trovato risposta? <a href="/contatti">Scrivici</a>.</p>
  </div>

  <script>
    const API = window.location.origin;
    const lista = document.getElementById("lista");

    fetch(`${API}/api/faq`)
      .then((res) => { if (!res.ok) throw new Error(); return res.json(); })
      .then((faq) => {
        if (!faq.length) {
          lista.innerHTML = '<div class="stato">Nessuna domanda disponibile al momento.</div>';
          return;
        }
        lista.innerHTML = faq.map((f, i) => `
          <div class="voce" id="voce-${i}">
            <button class="domanda" type="button" data-i="${i}">
              <span>${f.domanda}</span>
              <span class="segno">+</span>
            </button>
            <div class="risposta"><div class="risposta-interna">${f.risposta}</div></div>
          </div>
        `).join("");

        lista.querySelectorAll(".domanda").forEach((btn) => {
          btn.addEventListener("click", () => {
            const voce = btn.closest(".voce");
            const risposta = voce.querySelector(".risposta");
            const aperta = voce.classList.contains("aperta");
            voce.classList.toggle("aperta", !aperta);
            risposta.style.maxHeight = aperta ? "0" : `${risposta.scrollHeight}px`;
          });
        });
      })
      .catch(() => {
        lista.innerHTML = '<div class="stato">Non siamo riusciti a caricare le domande frequenti. Riprova tra poco.</div>';
      });
  </script>
</body>
</html>
