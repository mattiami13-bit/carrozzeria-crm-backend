<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifless — Pagamento annullato</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0A0B0D; color: #F3F1EC;
  }
  .card { width: 100%; max-width: 380px; background: #15171B; border: 1px solid #2A2E34; border-radius: 16px; padding: 32px; text-align: center; }
  .icona { font-size: 34px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  p { font-size: 13.5px; color: #A8A29B; line-height: 1.55; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="icona">↩️</div>
    <h1>Pagamento annullato</h1>
    <p>Nessun addebito è stato effettuato. Puoi tornare al gestionale e riprovare quando vuoi.</p>
  </div>
</body>
</html>
