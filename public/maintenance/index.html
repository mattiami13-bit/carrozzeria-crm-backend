<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rifless — Manutenzione in corso</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0A0B0D; color: #F3F1EC; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px; text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; font-weight: 700; font-size: 18px; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; }
  h1 { font-size: 21px; margin: 0 0 12px; }
  p { font-size: 14px; color: #C4C8D0; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/logo-icon.png" alt="Rifless"> Rifless</div>
    <h1>Manutenzione in corso</h1>
    <p>Stiamo aggiornando Rifless. Torniamo operativi a breve — riprova tra qualche minuto.</p>
  </div>
</body>
</html>
