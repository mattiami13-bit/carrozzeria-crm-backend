  DA_VERIFICARE: { simbolo: "⚠", label: "Da verificare", color: "#C9A24B" },
  NON_CONFORME: { simbolo: "✕", label: "Non conforme", color: "#B4472E" },
  NA: { simbolo: "N/A", label: "Non applicabile", color: "#6B6963" },
};
const QC_NC_STATO_STYLE = {
  APERTA: { label: "Aperta", color: "#B4472E" },
  IN_LAVORAZIONE: { label: "In lavorazione", color: "#C9A24B" },
  RISOLTA: { label: "Risolta", color: "#4E7F8C" },
  CHIUSA: { label: "Chiusa", color: "#2F8F5B" },
};

function QcEsitoSelector({ risultato, onSetEsito, disabled }) {
  return (
    <div style={{ display: "flex", gap: 5 }}>
      {Object.keys(QC_ESITO_STYLE).map((k) => {
        const s = QC_ESITO_STYLE[k];
        const attivo = risultato.esito === k;
        return (
          <button key={k} disabled={disabled} onClick={() => onSetEsito(risultato.chiave, k)} title={s.label} style={{
            width: 34, height: 30, borderRadius: 7, border: attivo ? `1.5px solid ${s.color}` : "1px solid #2A2E34",
            background: attivo ? s.color + "22" : "#0A0B0D", color: attivo ? s.color : "#8D9099", fontSize: k === "NA" ? 9.5 : 14, fontWeight: 700,
          }}>{s.simbolo}</button>
        );
      })}
    </div>
  );
}

function QcNonConformitaForm({ vehicleId, inspectionId, checkResultId, api, tecnici, onDone, onCancel }) {
  const [form, setForm] = useState({ descrizione: "", responsabileId: "", azioneCorrettiva: "", stato: "APERTA" });
  const [file, setFile] = useState(null);
  const [error, setError] = useState(null);
  const [salvando, setSalvando] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const salva = async () => {
    if (!form.descrizione.trim()) { setError("Descrivi la non conformità."); return; }
    setSalvando(true);
    setError(null);
    try {
      const body = new FormData();
      body.append("descrizione", form.descrizione.trim());
      if (form.responsabileId) body.append("responsabileId", form.responsabileId);
      if (form.azioneCorrettiva) body.append("azioneCorrettiva", form.azioneCorrettiva);
      body.append("stato", form.stato);
      if (checkResultId) body.append("checkResultId", checkResultId);
      if (file) body.append("file", file);
      await api(`/api/qc/inspections/${inspectionId}/non-conformita`, { method: "POST", body });
      onDone();
    } catch (e) { setError(e.message); } finally { setSalvando(false); }
  };

  return (
    <div style={{ background: "#0A0B0D", border: "1px solid #B4472E", borderRadius: 10, padding: 12, marginTop: 8 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#E5806B", marginBottom: 8 }}>Nuova non conformità</div>
      <textarea placeholder="Descrizione" value={form.descrizione} onChange={set("descrizione")} rows={2} style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5, marginBottom: 8, boxSizing: "border-box", fontFamily: "inherit" }} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
        <select value={form.responsabileId} onChange={set("responsabileId")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
          <option value="">Responsabile…</option>
          {tecnici.map((t) => <option key={t.id} value={t.id}>{t.nome} {t.cognome}</option>)}
        </select>
        <select value={form.stato} onChange={set("stato")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
          {Object.keys(QC_NC_STATO_STYLE).map((s) => <option key={s} value={s}>{QC_NC_STATO_STYLE[s].label}</option>)}
        </select>
      </div>
      <textarea placeholder="Azione correttiva" value={form.azioneCorrettiva} onChange={set("azioneCorrettiva")} rows={2} style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5, marginBottom: 8, boxSizing: "border-box", fontFamily: "inherit" }} />
      <input type="file" accept="image/*" capture="environment" onChange={(e) => setFile(e.target.files[0])} style={{ fontSize: 11.5, color: "#8D9099", marginBottom: 8 }} />
      {error && <div style={{ color: "#E5806B", fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={salva} disabled={salvando} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 12.5, fontWeight: 600 }}>{salvando ? "Salvataggio…" : "Apri non conformità"}</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>Annulla</button>
      </div>
    </div>
  );
}

function QcNonConformitaRow({ nc, api, onChanged }) {
  const [modificando, setModificando] = useState(false);
  const [stato, setStato] = useState(nc.stato);

    const blob = await api(`/api/qc/non-conformita/${nc.id}/fotografia`, { responseType: "blob" });

            <button onClick={salvaStato} style={{ padding: "4px 9px", borderRadius: 6, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 11, fontWeight: 600 }}>Salva</button>
          </>

    </div>

}

function QcPanel({ vehicleId, api, ruolo }) {
  const [ispezione, setIspezione] = useState(undefined); // undefined=loading, null=nessuna
  const [tecnici, setTecnici] = useState([]);
  const [ncPer, setNcPer] = useState(null); // chiave della voce per cui si sta aprendo una non conformità
  const [ncGenerale, setNcGenerale] = useState(false);
  const [error, setError] = useState(null);
  const [eventi, setEventi] = useState(null);
  const [mostraEventi, setMostraEventi] = useState(false);
  const [azionando, setAzionando] = useState(false);

  const load = useCallback(() => {
    Promise.all([api(`/api/vehicles/${vehicleId}/qc`), api("/api/users")])
      .then(([lista, users]) => { setIspezione(lista[0] || null); setTecnici(users); })
      .catch((e) => setError(e.message));
  }, [api, vehicleId]);
  useEffect(load, [load]);

  const avvia = async () => {
    setError(null);
    setAzionando(true);
    try { await api(`/api/vehicles/${vehicleId}/qc`, { method: "POST" }); load(); }
    catch (e) { setError(e.message); } finally { setAzionando(false); }
  };

  const setEsito = async (chiave, esito) => {
    setError(null);
    try {
      const nuovoEsito = ispezione.checkResults.find((r) => r.chiave === chiave)?.esito === esito ? null : esito;
      await api(`/api/qc/inspections/${ispezione.id}/esiti/${chiave}`, { method: "PATCH", body: JSON.stringify({ esito: nuovoEsito }) });
      load();
    } catch (e) { setError(e.message); }
  };

  const approva = async () => {
    setError(null);
    setAzionando(true);
    try { await api(`/api/qc/inspections/${ispezione.id}/approva`, { method: "POST" }); load(); }
    catch (e) {
      let msg = e.message;
      try { const parsed = JSON.parse(msg); msg = typeof parsed === "string" ? parsed : (parsed.error || msg) + (parsed.vociBloccanti ? `: ${parsed.vociBloccanti.join(", ")}` : parsed.vociDaValutare ? `: ${parsed.vociDaValutare.join(", ")}` : ""); } catch {}
      setError(msg);
    } finally { setAzionando(false); }
  };

  const apriEventi = async () => {
    setMostraEventi(!mostraEventi);
    if (!eventi) setEventi(await api(`/api/qc/inspections/${ispezione.id}/eventi`));
  };

  if (ispezione === undefined) return <div style={{ marginTop: 12 }}><Loading /></div>;

  return (
    <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 10 }}>{error}</div>}

      {!ispezione ? (
        <div>
          <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 10 }}>Nessun controllo qualità avviato per questa pratica. È obbligatorio prima di poter passare la pratica a "Pronta".</div>
          <button onClick={avvia} disabled={azionando} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600 }}>{azionando ? "Avvio…" : "Avvia controllo qualità"}</button>
        </div>
      ) : (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: ispezione.stato === "APPROVATO" ? "#2F8F5B" : "#C9A24B" }}>
              {ispezione.stato === "APPROVATO" ? `✓ QC approvato da ${ispezione.approvatoDa?.nome} ${ispezione.approvatoDa?.cognome} il ${new Date(ispezione.approvatoAt).toLocaleString("it-IT")}` : "QC in corso"}
            </span>
            <button onClick={apriEventi} style={{ padding: "4px 9px", borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", color: "#8D9099", fontSize: 11 }}>{mostraEventi ? "Nascondi" : "Storico"}</button>
          </div>

          {mostraEventi && (
            <div style={{ marginBottom: 12, borderBottom: "1px solid #2A2E34", paddingBottom: 10 }}>
              {!eventi ? <Loading /> : eventi.map((ev) => (
                <div key={ev.id} style={{ fontSize: 11, color: "#8D9099", marginBottom: 3 }}>
                  {new Date(ev.createdAt).toLocaleString("it-IT")} — {ev.tipo}{ev.attore ? ` (${ev.attore.nome} ${ev.attore.cognome})` : ""}
                </div>
              ))}
            </div>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 12 }}>
            {ispezione.checkResults.map((r) => (
              <div key={r.chiave} style={{ borderBottom: "1px solid #2A2E34", paddingBottom: 8, marginBottom: 4 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <div style={{ fontSize: 12.5 }}>{r.etichetta}{r.critico && <span style={{ color: "#B4472E", marginLeft: 4 }} title="Controllo critico">●</span>}</div>
                  <QcEsitoSelector risultato={r} onSetEsito={setEsito} disabled={ispezione.stato === "APPROVATO"} />
                </div>
                {r.esito === "NON_CONFORME" && ispezione.stato !== "APPROVATO" && (
                  ncPer === r.chiave ? (
                    <QcNonConformitaForm vehicleId={vehicleId} inspectionId={ispezione.id} checkResultId={r.id} api={api} tecnici={tecnici} onDone={() => { setNcPer(null); load(); }} onCancel={() => setNcPer(null)} />
                  ) : (
                    <button onClick={() => setNcPer(r.chiave)} style={{ marginTop: 6, padding: "3px 9px", borderRadius: 6, border: "1px solid #B4472E", background: "transparent", color: "#E5806B", fontSize: 11 }}>+ Apri non conformità</button>
                  )
                )}
              </div>
            ))}
          </div>

          {ispezione.nonConformita.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11.5, fontWeight: 700, color: "#8D9099", marginBottom: 6 }}>Non conformità</div>
              {ispezione.nonConformita.map((nc) => <QcNonConformitaRow key={nc.id} nc={nc} api={api} onChanged={load} />)}
            </div>
          )}

          {ispezione.stato !== "APPROVATO" && !ncGenerale && (
            <button onClick={() => setNcGenerale(true)} style={{ padding: "5px 10px", borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", color: "#8D9099", fontSize: 11, marginBottom: 12 }}>+ Non conformità generale (non legata a una voce)</button>
          )}
          {ncGenerale && <QcNonConformitaForm vehicleId={vehicleId} inspectionId={ispezione.id} checkResultId={null} api={api} tecnici={tecnici} onDone={() => { setNcGenerale(false); load(); }} onCancel={() => setNcGenerale(false)} />}

          {ispezione.stato !== "APPROVATO" && (
            <button onClick={approva} disabled={azionando} style={{ marginTop: 8, padding: "9px 16px", borderRadius: 8, border: "none", background: "#2F8F5B", color: "#fff", fontSize: 13, fontWeight: 700 }}>{azionando ? "Approvazione…" : "✓ Approva QC"}</button>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------- QC: checklist configurabile (Admin) ---------------- */
function QcChecklistSettingsView({ api }) {
  const [voci, setVoci] = useState(null);
  const [nuovaEtichetta, setNuovaEtichetta] = useState("");
  const [error, setError] = useState(null);

  const load = useCallback(() => { api("/api/qc/template").then(setVoci).catch((e) => setError(e.message)); }, [api]);
  useEffect(load, [load]);

  const salva = async (v) => {
    try { await api(`/api/qc/template/${v.chiave}`, { method: "PUT", body: JSON.stringify({ etichetta: v.etichetta, critico: v.critico, attivo: v.attivo, ordine: v.ordine }) }); load(); }
    catch (e) { setError(e.message); }
  };
  const aggiungi = async () => {
    if (!nuovaEtichetta.trim()) return;
    try { await api("/api/qc/template", { method: "POST", body: JSON.stringify({ etichetta: nuovaEtichetta.trim(), critico: true }) }); setNuovaEtichetta(""); load(); }
    catch (e) { setError(e.message); }
  };
  const elimina = async (chiave) => {
    try { await api(`/api/qc/template/${chiave}`, { method: "DELETE" }); load(); }
    catch (e) { setError(e.message); }
  };

  if (!voci) return <Loading />;

  return (
    <div>
      <h1 style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>Checklist Controllo Qualità</h1>
      <div style={{ fontSize: 12.5, color: "#8D9099", marginBottom: 18, maxWidth: 640 }}>
        Voci verificate prima di poter passare una pratica a "Pronta". Le voci segnate come critiche bloccano l'approvazione del QC se il loro esito è "Non conforme".
      </div>
      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 14 }}>{error}</div>}

      <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, overflow: "hidden", marginBottom: 16 }}>
        {voci.map((v, i) => (
          <div key={v.chiave} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderTop: i === 0 ? "none" : "1px solid #2A2E34" }}>
            <input value={v.etichetta} onChange={(e) => setVoci(voci.map((x) => x.chiave === v.chiave ? { ...x, etichetta: e.target.value } : x))} onBlur={() => salva(v)} style={{ flex: 1, padding: 7, borderRadius: 7, border: "1px solid #2A2E34", background: "#0A0B0D", color: "#F3F1EC", fontSize: 12.5 }} />
            <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11.5, color: "#D9D6CE", cursor: "pointer" }}>
              <input type="checkbox" checked={v.critico} onChange={(e) => salva({ ...v, critico: e.target.checked })} /> Critico
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11.5, color: "#D9D6CE", cursor: "pointer" }}>
              <input type="checkbox" checked={v.attivo} onChange={(e) => salva({ ...v, attivo: e.target.checked })} /> Attivo
            </label>
            {v.personalizzato && <button onClick={() => elimina(v.chiave)} style={{ padding: "4px 9px", borderRadius: 6, border: "1px solid #2A2E34", background: "#0A0B0D", color: "#B4472E", fontSize: 11 }}>Elimina</button>}
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        <input placeholder="Nuova voce personalizzata…" value={nuovaEtichetta} onChange={(e) => setNuovaEtichetta(e.target.value)} style={{ flex: 1, maxWidth: 320, padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }} />
        <button onClick={aggiungi} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 12.5, fontWeight: 600 }}>+ Aggiungi voce</button>
      </div>
    </div>
  );
}

function ClientDetailModal({ clientId, api, onClose, onSaved }) {

  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);

    api(`/api/clients/${clientId}`).then((c) => {
      setForm({
        nome: c.nome || "", cognome: c.cognome || "", telefono: c.telefono || "",
        email: c.email || "", codiceFiscale: c.codiceFiscale || "", indirizzo: c.indirizzo || "",
        notificheWhatsappConsenso: c.notificheWhatsappConsenso || false,
        notificheWhatsappAttive: c.notificheWhatsappAttive ?? true,
      });
    }).finally(() => setLoading(false));
  }, [clientId]);

  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const setBool = (k) => (e) => setForm({ ...form, [k]: e.target.checked });

  const submit = async () => {
    setError(null);
    setSaving(true);
    try {
      await api(`/api/clients/${clientId}`, { method: "PATCH", body: JSON.stringify(form) });
      onSaved();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(27,26,23,0.5)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#15171B", borderRadius: 16, width: 480, maxHeight: "85vh", overflowY: "auto", padding: 24,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h2 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Modifica cliente</h2>
          <button onClick={onClose} style={{
            border: "none", background: "#F1EFE8", width: 28, height: 28, borderRadius: 8, fontSize: 15, color: "#4A4842",
          }}>✕</button>
        </div>

        {loading || !form ? <Loading /> : (
          <>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <input placeholder="Nome" value={form.nome} onChange={set("nome")} style={{ padding: 9, borderRadius: 8, border: "1px solid #2A2E34" }} />
              <input placeholder="Cognome" value={form.cognome} onChange={set("cognome")} style={{ padding: 9, borderRadius: 8, border: "1px solid #2A2E34" }} />
              <input placeholder="Telefono" value={form.telefono} onChange={set("telefono")} style={{ padding: 9, borderRadius: 8, border: "1px solid #2A2E34" }} />
              <input placeholder="Email" value={form.email} onChange={set("email")} style={{ padding: 9, borderRadius: 8, border: "1px solid #2A2E34" }} />
              <input placeholder="Codice fiscale" value={form.codiceFiscale} onChange={set("codiceFiscale")} style={{ padding: 9, borderRadius: 8, border: "1px solid #2A2E34" }} />
              <input placeholder="Indirizzo" value={form.indirizzo} onChange={set("indirizzo")} style={{ padding: 9, borderRadius: 8, border: "1px solid #2A2E34" }} />
            </div>

            <div style={{ marginTop: 16, padding: 12, borderRadius: 10, border: "1px solid #2A2E34", background: "#1B1E23" }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#C9A24B", marginBottom: 8 }}>Comunicazioni automatiche WhatsApp</div>

                <input type="checkbox" checked={form.notificheWhatsappConsenso} onChange={setBool("notificheWhatsappConsenso")} style={{ marginTop: 2 }} />
                <span>Il cliente ha dato il consenso a ricevere comunicazioni WhatsApp sull'avanzamento della pratica (privacy).</span>
              </label>
              <label style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 12.5, color: "#D9D6CE", cursor: "pointer" }}>
                <input type="checkbox" checked={form.notificheWhatsappAttive} onChange={setBool("notificheWhatsappAttive")} style={{ marginTop: 2 }} />
                <span>Notifiche automatiche attive per questo cliente (disattivabile in qualsiasi momento senza revocare il consenso).</span>
              </label>
            </div>

            {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginTop: 12 }}>{error}</div>}

            <div style={{ marginTop: 16, display: "flex", gap: 8 }}>
              <button onClick={submit} disabled={saving} style={{
                padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600,
              }}>{saving ? "Salvataggio…" : "Salva"}</button>
              <button onClick={onClose} style={{
                padding: "8px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13, fontWeight: 600,
              }}>Annulla</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function NewClientForm({ api, onDone, onCancel }) {

const [form, setForm] = useState({ nome: "", cognome: "", telefono: "", email: "" });
  const [error, setError] = useState(null);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const submit = async () => {
    try {
      await api("/api/clients", { method: "POST", body: JSON.stringify(form) });
      onDone();
    } catch (e) { setError(e.message); }
  };

  return (
    <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
        <input placeholder="Nome" value={form.nome} onChange={set("nome")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
        <input placeholder="Cognome" value={form.cognome} onChange={set("cognome")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
        <input placeholder="Telefono" value={form.telefono} onChange={set("telefono")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
        <input placeholder="Email" value={form.email} onChange={set("email")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
      </div>
      {error && <div style={{ color: "#B4472E", fontSize: 12, marginTop: 8 }}>{error}</div>}
      <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13 }}>Salva</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13 }}>Annulla</button>

/* ---------------- SINISTRI VIEW ---------------- */
const SINISTRO_STATI = [
  { key: "APERTO", label: "Aperto", color: "#9C9890" },
  { key: "INVIATO_ASSICURAZIONE", label: "Inviato assicurazione", color: "#A79C86" },
  { key: "PERIZIA_FISSATA", label: "Perizia fissata", color: "#B39A6E" },
  { key: "PERIZIA_COMPLETATA", label: "Perizia completata", color: "#BE9257" },
  { key: "APPROVATO", label: "Approvato", color: "#4E7F8C" },
  { key: "LAVORAZIONE", label: "In lavorazione", color: "#C9A24B" },
  { key: "COMPLETATO", label: "Completato", color: "#2F8F5B" },
  { key: "LIQUIDATO", label: "Liquidato", color: "#6B6963" },
];
const sinistroStatoOf = (key) => SINISTRO_STATI.find((s) => s.key === key) || SINISTRO_STATI[0];

function SinistriView({ api, ruolo, clientFilter, onClearClientFilter }) {
  const [sinistri, setSinistri] = useState([]);
  const [clients, setClients] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [filtroStato, setFiltroStato] = useState("");
  const [search, setSearch] = useState("");
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    setError(null);
    const params = new URLSearchParams();
    if (filtroStato) params.set("stato", filtroStato);
    if (clientFilter) params.set("clientId", clientFilter.id);
    if (search) params.set("search", search);
    const qs = params.toString();
    Promise.all([
      api(`/api/sinistri${qs ? `?${qs}` : ""}`),
      api("/api/clients"),
      api("/api/vehicles"),
    ])
      .then(([s, c, v]) => { setSinistri(s); setClients(c); setVehicles(v); })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, [api, filtroStato, clientFilter, search]);

  useEffect(load, [load]);

  if (loading) return <Loading />;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, fontWeight: 700 }}>Sinistri</h1>
        <button onClick={() => setShowForm(true)} style={{
          padding: "8px 14px", borderRadius: 8, border: "none", background: "#C9A24B", color: "#15171B", fontSize: 13, fontWeight: 600,
        }}>+ Nuovo sinistro</button>
      </div>

      {clientFilter && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#F1EFE8", padding: "8px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13 }}>
          <span>Filtrato per cliente: <strong>{clientFilter.nome} {clientFilter.cognome}</strong></span>
          <button onClick={onClearClientFilter} style={{ marginLeft: "auto", border: "none", background: "transparent", color: "#8D9099", fontSize: 12 }}>Rimuovi filtro ✕</button>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
        <input placeholder="Cerca per numero pratica, targa, cliente…" value={search} onChange={(e) => setSearch(e.target.value)}
          style={{ padding: "7px 10px", borderRadius: 8, border: "1px solid #2A2E34", fontSize: 13, minWidth: 240, background: "#1B1E23", color: "#F3F1EC" }} />
        <button onClick={() => setFiltroStato("")} style={{
          padding: "6px 12px", borderRadius: 20, border: "1px solid #2A2E34", fontSize: 12,
          background: filtroStato === "" ? "#F3F1EC" : "#15171B", color: filtroStato === "" ? "#15171B" : "#4A4842",
        }}>Tutti</button>
        {SINISTRO_STATI.map((s) => (
          <button key={s.key} onClick={() => setFiltroStato(s.key)} style={{
            padding: "6px 12px", borderRadius: 20, border: "1px solid #2A2E34", fontSize: 12,
            background: filtroStato === s.key ? "#F3F1EC" : "#15171B", color: filtroStato === s.key ? "#15171B" : "#4A4842",
          }}>{s.label}</button>
        ))}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginBottom: 16 }}>{error}</div>}

      {showForm && (
        <NewSinistroForm
          clients={clients}
          vehicles={vehicles}
          defaultClientId={clientFilter?.id}
          api={api}
          onDone={() => { setShowForm(false); load(); }}
          onCancel={() => setShowForm(false)}
        />
      )}

      <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, overflow: "hidden" }}>
        {sinistri.length === 0 && <div style={{ padding: 20, fontSize: 13, color: "#8D9099" }}>Nessun sinistro ancora.</div>}
        {sinistri.map((s, i) => {
          const st = sinistroStatoOf(s.stato);
          const residuo = Number(s.importoTotale || 0) - Number(s.pagatoAssicurazione || 0) - Number(s.pagatoCliente || 0);
          return (
            <div key={s.id} onClick={() => setSelectedId(s.id)} style={{
              display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", cursor: "pointer",
              borderTop: i === 0 ? "none" : "1px solid #F1EFE8",
            }}>
              <div style={{ width: 4, height: 32, borderRadius: 4, background: st.color }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>
                  {s.numeroPratica || "Senza numero pratica"} — {s.client?.nome} {s.client?.cognome}
                </div>
                <div style={{ fontSize: 12, color: "#8D9099" }}>
                  {s.vehicle ? `${s.vehicle.marca} ${s.vehicle.modello} — ${s.vehicle.targa}` : "Nessun veicolo collegato"}
                  {s.compagniaAssicurativa ? ` · ${s.compagniaAssicurativa}` : ""}
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 14, fontWeight: 700 }}>{euro(s.importoTotale)}</div>
                {residuo !== 0 && <div style={{ fontSize: 11, color: "#B4472E" }}>residuo {euro(residuo)}</div>}
              </div>
              <span style={{
  fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20,
  background: "#1B1E23", color: st.color, border: "1px solid #2A2E34",
}}>{st.label}</span>
            </div>
          );
        })}
      </div>

      {selectedId && (
        <SinistroDetailModal
          ruolo={ruolo}
          sinistroId={selectedId}
          api={api}
          onClose={() => setSelectedId(null)}
          onChanged={load}
        />
      )}
    </div>
  );
}

function NewSinistroForm({ clients, vehicles, defaultClientId, api, onDone, onCancel }) {
  const [clientId, setClientId] = useState(defaultClientId || clients[0]?.id || "");
  const [vehicleId, setVehicleId] = useState("");
  const [numeroPratica, setNumeroPratica] = useState("");
  const [compagniaAssicurativa, setCompagniaAssicurativa] = useState("");
  const [perito, setPerito] = useState("");
  const [responsabile, setResponsabile] = useState("");
  const [importoTotale, setImportoTotale] = useState("");
  const [franchigiaPercentuale, setFranchigiaPercentuale] = useState("");
  const [franchigiaImporto, setFranchigiaImporto] = useState("");
  const [franchigiaModificataManualmente, setFranchigiaModificataManualmente] = useState(false);
  const [note, setNote] = useState("");
  const [error, setError] = useState(null);

  const veicoliCliente = vehicles.filter((v) => v.clientId === clientId);

  // Calcolo automatico della franchigia da percentuale + importo totale,
  // finché l'utente non la corregge manualmente (come richiesto).
  useEffect(() => {
    if (franchigiaModificataManualmente) return;
    const tot = Number(importoTotale || 0);
    const perc = Number(franchigiaPercentuale || 0);
    if (tot > 0 && perc > 0) setFranchigiaImporto((tot * perc / 100).toFixed(2));
  }, [importoTotale, franchigiaPercentuale, franchigiaModificataManualmente]);

  const submit = async () => {
    setError(null);
    if (!clientId) { setError("Seleziona un cliente"); return; }
    try {
      await api("/api/sinistri", {
        method: "POST",
        body: JSON.stringify({
          clientId,
          vehicleId: vehicleId || undefined,
          numeroPratica: numeroPratica || undefined,
          compagniaAssicurativa: compagniaAssicurativa || undefined,
          perito: perito || undefined,
          responsabile: responsabile || undefined,
          importoTotale: importoTotale !== "" ? Number(importoTotale) : undefined,
          franchigiaPercentuale: franchigiaPercentuale !== "" ? Number(franchigiaPercentuale) : undefined,
          franchigiaImporto: franchigiaImporto !== "" ? Number(franchigiaImporto) : undefined,
          note: note || undefined,
        }),
      });
      onDone();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        <select value={clientId} onChange={(e) => { setClientId(e.target.value); setVehicleId(""); }}
          style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }}>
          {clients.length === 0 && <option value="">Crea prima un cliente</option>}
          {clients.map((c) => <option key={c.id} value={c.id}>{c.nome} {c.cognome}</option>)}
        </select>
        <select value={vehicleId} onChange={(e) => setVehicleId(e.target.value)}
          style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }}>
          <option value="">Nessun veicolo collegato (facoltativo)</option>
          {veicoliCliente.map((v) => <option key={v.id} value={v.id}>{v.marca} {v.modello} — {v.targa}</option>)}
        </select>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <Field label="Numero pratica" value={numeroPratica} onChange={(e) => setNumeroPratica(e.target.value)} />
        <Field label="Compagnia assicurativa" value={compagniaAssicurativa} onChange={(e) => setCompagniaAssicurativa(e.target.value)} />
        <Field label="Perito" value={perito} onChange={(e) => setPerito(e.target.value)} />
        <Field label="Responsabile pratica" value={responsabile} onChange={(e) => setResponsabile(e.target.value)} />
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: "#4A4842", margin: "4px 0 8px" }}>Importi</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
        <Field label="Importo totale €" type="number" value={importoTotale} onChange={(e) => setImportoTotale(e.target.value)} />
        <Field label="Franchigia %" type="number" value={franchigiaPercentuale} onChange={(e) => setFranchigiaPercentuale(e.target.value)} />
        <Field label="Franchigia € (correggibile)" type="number" value={franchigiaImporto}
          onChange={(e) => { setFranchigiaImporto(e.target.value); setFranchigiaModificataManualmente(true); }} />
      </div>

      <div style={{ marginBottom: 10 }}>
        <label style={{ display: "block", fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Note</label>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} rows={2} style={{
          width: "100%", padding: 9, borderRadius: 8, border: "1px solid #2A2E34", fontSize: 14, fontFamily: "inherit", resize: "vertical",
        }} />
      </div>

      {error && <div style={{ color: "#B4472E", fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13 }}>Salva</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13 }}>Annulla</button>
      </div>
    </div>
  );
}

function SinistroDetailModal({ sinistroId, api, ruolo, onClose: closeRequested, onChanged }) {
  const [profitDirty,setProfitDirty]=useState(false);
  const [delayDirty,setDelayDirty]=useState(false);
  const [partsDirty,setPartsDirty]=useState(false);
  const [photoDirty,setPhotoDirty]=useState(false);
  const onClose=()=>{if((!profitDirty&&!delayDirty&&!partsDirty&&!photoDirty)||confirm("Scartare le modifiche non salvate della pratica?"))closeRequested();};
  const [sinistro, setSinistro] = useState(null);
  const [form, setForm] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    api(`/api/sinistri/${sinistroId}`)
      .then((s) => {
        setSinistro(s);
        setForm({
          numeroPratica: s.numeroPratica || "",
          compagniaAssicurativa: s.compagniaAssicurativa || "",
          perito: s.perito || "",
          responsabile: s.responsabile || "",
          stato: s.stato,
          importoTotale: s.importoTotale ?? "",
          franchigiaPercentuale: s.franchigiaPercentuale ?? "",
          franchigiaImporto: s.franchigiaImporto ?? "",
          pagatoAssicurazione: s.pagatoAssicurazione ?? "",
          pagatoCliente: s.pagatoCliente ?? "",
          note: s.note || "",
        });
      })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, [api, sinistroId]);

  useEffect(load, [load]);

  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const salva = async () => {
    setSaving(true);
    setError(null);
    try {
      await api(`/api/sinistri/${sinistroId}`, {
        method: "PATCH",
        body: JSON.stringify({
          numeroPratica: form.numeroPratica || undefined,
          compagniaAssicurativa: form.compagniaAssicurativa || undefined,
          perito: form.perito || undefined,
          responsabile: form.responsabile || undefined,
          stato: form.stato,
          importoTotale: form.importoTotale !== "" ? Number(form.importoTotale) : undefined,
          franchigiaPercentuale: form.franchigiaPercentuale !== "" ? Number(form.franchigiaPercentuale) : undefined,
          franchigiaImporto: form.franchigiaImporto !== "" ? Number(form.franchigiaImporto) : undefined,
          pagatoAssicurazione: form.pagatoAssicurazione !== "" ? Number(form.pagatoAssicurazione) : undefined,
          pagatoCliente: form.pagatoCliente !== "" ? Number(form.pagatoCliente) : undefined,
          note: form.note || undefined,
        }),
      });
      await load();
      onChanged();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(27,26,23,0.5)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#15171B", borderRadius: 16, width: 600, maxWidth: "95vw", maxHeight: "85vh", overflowY: "auto", padding: 24,
      }}>
        {loading || !form ? <Loading /> : (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
              <div>
                <h2 style={{ fontSize: 18, fontWeight: 700, margin: "0 0 2px" }}>
                  {sinistro.numeroPratica || "Sinistro senza numero pratica"}
                </h2>
                <div style={{ fontSize: 13, color: "#8D9099" }}>
                  {sinistro.client?.nome} {sinistro.client?.cognome}
                  {sinistro.vehicle ? ` · ${sinistro.vehicle.marca} ${sinistro.vehicle.modello} — ${sinistro.vehicle.targa}` : " · Nessun veicolo collegato"}
                </div>

              </div>
              <button onClick={onClose} style={{
                border: "none", background: "#F1EFE8", width: 28, height: 28, borderRadius: 8, fontSize: 15, color: "#4A4842",
              }}>✕</button>
            </div>

                  {sinistro.vehicleId && <SmartPhotoTimeline vehicleId={sinistro.vehicleId} api={api} onDirtyChange={setPhotoDirty} />}
                  {sinistro.vehicleId && <PartsPanel vehicleId={sinistro.vehicleId} api={api} onDirtyChange={setPartsDirty} />}
                  {sinistro.vehicleId && <DelayPanel vehicleId={sinistro.vehicleId} api={api} clientPhone={sinistro.client?.telefono} onDirtyChange={setDelayDirty} />}
                  {sinistro.vehicleId && ["ADMIN","AMMINISTRAZIONE"].includes(ruolo) && <ProfitTracker vehicleId={sinistro.vehicleId} api={api} onDirtyChange={setProfitDirty} />}

            {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginTop: 12 }}>{error}</div>}

            <div style={{ marginTop: 16, marginBottom: 12 }}>
              <label style={{ display: "block", fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Stato pratica</label>
              <select value={form.stato} onChange={set("stato")} style={{
                width: "100%", padding: 9, borderRadius: 8, border: "1px solid #2A2E34", fontSize: 14,
              }}>
                {SINISTRO_STATI.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Field label="Numero pratica" value={form.numeroPratica} onChange={set("numeroPratica")} />
              <Field label="Compagnia assicurativa" value={form.compagniaAssicurativa} onChange={set("compagniaAssicurativa")} />
              <Field label="Perito" value={form.perito} onChange={set("perito")} />
              <Field label="Responsabile pratica" value={form.responsabile} onChange={set("responsabile")} />
            </div>

            <div style={{ fontSize: 12, fontWeight: 700, color: "#4A4842", margin: "4px 0 8px" }}>Importi e pagamenti</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <Field label="Importo totale €" type="number" value={form.importoTotale} onChange={set("importoTotale")} />
              <Field label="Franchigia %" type="number" value={form.franchigiaPercentuale} onChange={set("franchigiaPercentuale")} />
              <Field label="Franchigia € (correggibile)" type="number" value={form.franchigiaImporto} onChange={set("franchigiaImporto")} />
              <Field label="Pagato da assicurazione €" type="number" value={form.pagatoAssicurazione} onChange={set("pagatoAssicurazione")} />
              <Field label="Pagato da cliente €" type="number" value={form.pagatoCliente} onChange={set("pagatoCliente")} />
            </div>

            <div style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              background: "#0A0B0D", borderRadius: 10, padding: "10px 12px", marginBottom: 12, fontSize: 13,
            }}>
              <span>Residuo da incassare</span>
              {(() => {
                const residuo = Number(form.importoTotale || 0) - Number(form.pagatoAssicurazione || 0) - Number(form.pagatoCliente || 0);
                return <strong style={{ color: residuo > 0 ? "#B4472E" : "#2F8F5B" }}>{euro(residuo)}</strong>;
              })()}
            </div>

            <div style={{ marginBottom: 12 }}>
              <label style={{ display: "block", fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Note</label>

                width: "100%", padding: 9, borderRadius: 8, border: "1px solid #2A2E34", fontSize: 14, fontFamily: "inherit", resize: "vertical",
              }} />
            </div>

            <div style={{ fontSize: 11, color: "#8D9099", marginBottom: 12 }}>
              Aperto il {new Date(sinistro.dataApertura || sinistro.createdAt).toLocaleDateString("it-IT")}

            <button onClick={salva} disabled={saving} style={{
              padding: "9px 16px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600,
            }}>{saving ? "Salvataggio…" : "Salva modifiche"}</button>

        )}
      </div>
    </div>
  );
}

/* ---------------- ASSISTENTE IA CONVERSAZIONALE ---------------- */
/* ---------------- AI COPILOT ----------------
   Assistente separato dal vecchio "Assistente Ombra" qui sotto (che resta
   invariato): stesso principio — solo lettura, mai inventa dati — ma con
   più strumenti (ritardi, margini, disponibilità tecnici) e "riferimenti"
   ai record reali consultati, per mostrare link diretti alla pratica e
   quick action, sempre rispettando i permessi del ruolo (lato server). */
const quickBtnStyle = {
  fontSize: 11, fontWeight: 600, padding: "5px 10px", borderRadius: 6,
  border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", cursor: "pointer",
};

function AiCopilot({ api, onNavigateTab, onApriPraticaVeicolo }) {
  const [aperto, setAperto] = useState(false);
  const [messaggi, setMessaggi] = useState([]); // { autore: "utente" | "copilot", testo, riferimenti? }
  const [domanda, setDomanda] = useState("");
  const [inviando, setInviando] = useState(false);
  const [errore, setErrore] = useState(null);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messaggi, inviando]);

  const invia = async () => {
    const testo = domanda.trim();
    if (!testo || inviando) return;
    setErrore(null);
    setMessaggi((m) => [...m, { autore: "utente", testo }]);
    setDomanda("");
    setInviando(true);
    try {
      const res = await api("/api/copilot/chiedi", { method: "POST", body: JSON.stringify({ domanda: testo }) });
      setMessaggi((m) => [...m, { autore: "copilot", testo: res.risposta, riferimenti: res.riferimenti || [] }]);
    } catch (e) {
      setErrore(e.message);
    } finally {
      setInviando(false);
    }
  };

  const contattaCliente = (rif) => {
    if (!rif.clienteTelefono) return;
    const numero = rif.clienteTelefono.replace(/[^\d+]/g, "").replace(/^\+/, "");
    window.open(`https://wa.me/${numero}`, "_blank");
  };

  return (
    <>
      {aperto && (
        <div style={{
          position: "fixed", bottom: 88, left: 24, width: 400, maxWidth: "calc(100vw - 48px)", height: 560,
          maxHeight: "calc(100vh - 120px)", background: "#15171B", borderRadius: 16, border: "1px solid #2A2E34",
          boxShadow: "0 12px 32px rgba(27,26,23,0.18)", display: "flex", flexDirection: "column", zIndex: 61,
        }}>
          <div style={{ padding: "14px 16px", borderBottom: "1px solid #F1EFE8", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>✨ AI Copilot</div>
            <button onClick={() => setAperto(false)} style={{
              border: "none", background: "#F1EFE8", width: 24, height: 24, borderRadius: 7, fontSize: 13, color: "#4A4842",
            }}>✕</button>
          </div>

          <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 14, display: "flex", flexDirection: "column", gap: 12 }}>
            {messaggi.length === 0 && (
              <div style={{ fontSize: 12, color: "#8D9099", lineHeight: 1.5 }}>
                Chiedimi qualsiasi cosa sui tuoi dati reali — es. "quali auto sono in ritardo?", "quanto sto guadagnando sulla BMW X3?",
                "quali tecnici hanno disponibilità oggi?", "quali preventivi non sono ancora stati approvati?".
                Rispondo solo con dati veri del gestionale, mai inventati.
              </div>
            )}
            {messaggi.map((m, i) => (
              <div key={i} style={{ alignSelf: m.autore === "utente" ? "flex-end" : "flex-start", maxWidth: "92%" }}>
                <div style={{
                  padding: "8px 12px", borderRadius: 12, fontSize: 13, lineHeight: 1.45,
                  background: m.autore === "utente" ? "#F3F1EC" : "#F1EFE8",
                  color: m.autore === "utente" ? "#15171B" : "#F3F1EC",
                  whiteSpace: "pre-wrap",
                }}>{m.testo}</div>

                {m.riferimenti?.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                    {m.riferimenti.map((rif, j) => (
                      <div key={j} style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 10, padding: 10 }}>
                        <div style={{ fontSize: 12, fontWeight: 700 }}>
                          {rif.tipo === "veicolo" && `${rif.marca} ${rif.modello} — ${rif.targa}`}
                          {rif.tipo === "preventivo" && `Preventivo ${rif.veicoloLabel || ""} — ${euro(rif.totale)}`}
                          {rif.tipo === "cliente" && rif.clienteNome}
                        </div>
                        {rif.clienteNome && rif.tipo !== "cliente" && (
                          <div style={{ fontSize: 11, color: "#8D9099", marginTop: 2 }}>{rif.clienteNome}</div>
                        )}
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                          {rif.tipo === "veicolo" && (
                            <>
                              <button onClick={() => onApriPraticaVeicolo(rif.id)} style={quickBtnStyle}>Apri pratica</button>
                              <button onClick={() => onNavigateTab("magazzino")} style={quickBtnStyle}>Visualizza ricambi</button>
                            </>
                          )}
                          {rif.tipo === "preventivo" && (
                            <button onClick={() => onNavigateTab("preventivi")} style={quickBtnStyle}>Mostra dettagli</button>
                          )}
                          {rif.clienteTelefono && (
                            <button onClick={() => contattaCliente(rif)} style={quickBtnStyle}>Contatta cliente</button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
            {inviando && <div style={{ alignSelf: "flex-start", fontSize: 12, color: "#8D9099" }}>Sto controllando i dati…</div>}
            {errore && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 9, borderRadius: 8 }}>{errore}</div>}
          </div>

          <div style={{ padding: 12, borderTop: "1px solid #F1EFE8", display: "flex", gap: 8 }}>
            <input
              value={domanda}
              onChange={(e) => setDomanda(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") invia(); }}
              placeholder="Chiedi al Copilot…"
              disabled={inviando}
              style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid #2A2E34", fontSize: 13 }}
            />
            <button onClick={invia} disabled={inviando || !domanda.trim()} style={{
              padding: "8px 14px", borderRadius: 8, border: "none", background: "#C9A24B", color: "#15171B", fontSize: 13, fontWeight: 700,
            }}>Invia</button>
          </div>
        </div>
      )}

      <button onClick={() => setAperto((a) => !a)} style={{
        position: "fixed", bottom: 24, left: 24, padding: "0 18px", height: 52, borderRadius: 26,
        background: "#C9A24B", color: "#15171B", border: "none", fontSize: 14, fontWeight: 700,
        boxShadow: "0 8px 20px rgba(27,26,23,0.25)", zIndex: 61, cursor: "pointer",
        display: "flex", alignItems: "center", gap: 8,
      }}>{aperto ? "✕ Chiudi" : "✨ Chiedi al Copilot"}</button>
    </>
  );
}

/* ---------------- REGISTRO ATTIVITÀ (solo ADMIN) ---------------- */
function RegistroAttivitaView({ api }) {
  const [log, setLog] = useState(null);
  const [errore, setErrore] = useState(null);

  useEffect(() => {
    api("/api/dashboard/registro-attivita")
      .then(setLog)
      .catch((e) => setErrore(e.message));
  }, [api]);

  const coloreEsito = (esito) => {
    if (esito >= 400) return "#B4472E";
    if (esito >= 300) return "#C9A24B";
    return "#2F8F5B";
  };

  return (
    <div>
      <h1 style={{ fontSize: 20, fontWeight: 700, marginBottom: 4 }}>Registro attività</h1>
      <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 20 }}>
        Ultime 100 azioni: creazioni, modifiche, cancellazioni e tentativi di accesso respinti. Visibile solo agli account Admin.
      </div>

      {errore && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginBottom: 16 }}>{errore}</div>}

      {!log && !errore && <Loading />}

      {log && (
        <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, overflow: "hidden" }}>
          {log.length === 0 && <div style={{ padding: 20, fontSize: 13, color: "#8D9099" }}>Nessuna attività registrata ancora.</div>}
          {log.map((l, i) => (
            <div key={i} style={{
              display: "flex", alignItems: "center", gap: 12, padding: "10px 16px", fontSize: 13,
              borderTop: i === 0 ? "none" : "1px solid #F1EFE8",
            }}>
              <div style={{ width: 140, fontSize: 11, color: "#8D9099", flexShrink: 0 }}>
                {new Date(l.quando).toLocaleString("it-IT")}
              </div>
              <div style={{ width: 190, flexShrink: 0 }}>{l.utente}</div>
              <div style={{
                width: 56, flexShrink: 0, fontFamily: "monospace", fontSize: 11, fontWeight: 700,
                color: "#4A4842",
              }}>{l.metodo}</div>
              <div style={{ flex: 1, fontFamily: "monospace", fontSize: 12, color: "#4A4842", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {l.percorso}
              </div>
              <div style={{ width: 44, flexShrink: 0, textAlign: "right", fontWeight: 700, color: coloreEsito(l.esito) }}>
                {l.esito}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Loading() {
  return <div style={{ padding: 40, textAlign: "center", color: "#8D9099", fontSize: 14 }}>Caricamento…</div>;
}

/* ---------------- ERROR BOUNDARY ----------------
   Rete di sicurezza a livello applicazione: se un componente qualsiasi
   lancia un errore di rendering, mostra un messaggio recuperabile invece
   di una pagina bianca. Non cambia in nulla il comportamento normale
   quando non ci sono errori — i figli vengono renderizzati esattamente
   come prima. */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error("Errore applicazione:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{
          minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
          flexDirection: "column", gap: 12, padding: 24, textAlign: "center", background: "#0A0B0D", color: "#F3F1EC",
        }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>Si è verificato un errore imprevisto</div>
          <div style={{ fontSize: 13, color: "#8D9099", maxWidth: 380 }}>
            Ricarica la pagina per continuare — nessun dato è stato perso, era solo un problema di visualizzazione.
          </div>
          <button onClick={() => window.location.reload()} style={{
            padding: "9px 18px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600, cursor: "pointer",
          }}>Ricarica la pagina</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
