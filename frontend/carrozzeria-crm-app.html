  { key: "BOZZA", label: "Bozza", color: "#9C9890" },
  { key: "INVIATO", label: "Inviato", color: "#B39A6E" },
  { key: "ACCETTATO", label: "Accettato", color: "#2F8F5B" },
  { key: "RIFIUTATO", label: "Rifiutato", color: "#B4472E" },
];
const statoOf = (key) => QUOTE_STATI.find((s) => s.key === key) || QUOTE_STATI[0];

function PreventiviView({ api, token }) {
  const [quotes, setQuotes] = useState([]);
  const [clients, setClients] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [error, setError] = useState(null);
  const [firmaQuoteId, setFirmaQuoteId] = useState(null);
  const [firmando, setFirmando] = useState(false);
  const [erroreFirma, setErroreFirma] = useState(null);
  const [vediFirmaQuote, setVediFirmaQuote] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    Promise.all([api("/api/quotes"), api("/api/clients"), api("/api/vehicles")])
      .then(([q, c, v]) => { setQuotes(q); setClients(c); setVehicles(v); })
      .finally(() => setLoading(false));
  }, [api]);

  useEffect(load, [load]);

  const changeStato = async (id, stato) => {
    await api(`/api/quotes/${id}/stato`, { method: "PATCH", body: JSON.stringify({ stato }) });
    load();
  };

  const scarica = async (q) => {
    try {
      await downloadQuotePdf(token, q.id, `preventivo-${q.vehicle.targa}.pdf`);
    } catch (e) {
      setError(e.message);
    }
  };

  const salvaFirma = async (firmaDataUrl, firmatarioNome) => {
    setErroreFirma(null);
    setFirmando(true);
    try {
      await api(`/api/quotes/${firmaQuoteId}/firma`, {
        method: "POST",
        body: JSON.stringify({ firmaDataUrl, firmatarioNome }),
      });
      setFirmaQuoteId(null);
      load();
    } catch (e) {
      setErroreFirma(e.message);
    } finally {
      setFirmando(false);
    }
  };

  if (loading) return <Loading />;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, fontWeight: 700 }}>Preventivi</h1>
        <button onClick={() => setShowForm(true)} style={{
          padding: "8px 14px", borderRadius: 8, border: "none", background: "#C9A24B", color: "#15171B", fontSize: 13, fontWeight: 600,
        }}>+ Nuovo preventivo</button>
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginBottom: 16 }}>{error}</div>}

      {showForm && (
        <NewQuoteForm
          clients={clients}
          vehicles={vehicles}
          api={api}
          onDone={() => { setShowForm(false); load(); }}
          onCancel={() => setShowForm(false)}
        />
      )}

      <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, overflow: "hidden" }}>
        {quotes.length === 0 && <div style={{ padding: 20, fontSize: 13, color: "#8D9099" }}>Nessun preventivo ancora.</div>}
        {quotes.map((q, i) => {
          const s = statoOf(q.stato);
          return (
            <div key={q.id} style={{
              display: "flex", alignItems: "center", gap: 12, padding: "12px 16px",
              borderTop: i === 0 ? "none" : "1px solid #F1EFE8",
            }}>
              <div style={{ width: 4, height: 32, borderRadius: 4, background: s.color }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{q.vehicle?.marca} {q.vehicle?.modello} — {q.vehicle?.targa}</div>
                <div style={{ fontSize: 12, color: "#8D9099" }}>{q.client?.nome} {q.client?.cognome}</div>
              </div>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{euro(q.totale)}</div>
              <select value={q.stato} onChange={(e) => changeStato(q.id, e.target.value)} style={{
                  fontSize: 12, padding: "5px 8px", borderRadius: 6, border: "1px solid #2A2E34", background: "#1B1E23", color: "#F3F1EC",
              }}>
                {QUOTE_STATI.map((st) => <option key={st.key} value={st.key}>{st.label}</option>)}
              </select>
              {q.firmaDataUrl ? (
                <button onClick={() => setVediFirmaQuote(q)} style={{
                  fontSize: 11, fontWeight: 700, padding: "6px 10px", borderRadius: 20, border: "none",
                  background: "#2F8F5B22", color: "#2F8F5B",
                }}>✓ Firmato</button>
              ) : q.stato === "INVIATO" ? (
                <button onClick={() => setFirmaQuoteId(q.id)} style={{
  padding: "7px 12px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12, fontWeight: 600,
                }}>Firma</button>
              ) : null}
              <button onClick={() => scarica(q)} style={{
  padding: "7px 12px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12, fontWeight: 600,
              }}>Scarica PDF</button>
            </div>
          );
        })}
      </div>

      {firmaQuoteId && (
        <FirmaModal
          titolo="Firma accettazione preventivo"
          sottotitolo='Firmando, il preventivo passa automaticamente a "Accettato".'
          salvando={firmando}
          errore={erroreFirma}
          onSalva={salvaFirma}
          onAnnulla={() => setFirmaQuoteId(null)}
        />
      )}

      {vediFirmaQuote && (
        <VisualizzaFirmaModal
          firmaDataUrl={vediFirmaQuote.firmaDataUrl}
          firmatario={vediFirmaQuote.firmatarioNome}
          quando={vediFirmaQuote.firmatoAt}
          onClose={() => setVediFirmaQuote(null)}
        />
      )}
    </div>
  );
}

const QUOTE_ITEM_TIPI = [
  { key: "MANODOPERA", label: "Manodopera" },
  { key: "RICAMBIO", label: "Ricambio" },
  { key: "VERNICE", label: "Vernice" },
  { key: "ALTRO", label: "Altro" },
];

function NewQuoteForm({ clients, vehicles, api, onDone, onCancel }) {
  const [clientId, setClientId] = useState(clients[0]?.id || "");
  const [vehicleId, setVehicleId] = useState(vehicles[0]?.id || "");
  const [aliquotaIva, setAliquotaIva] = useState(22);
  const [items, setItems] = useState([{ tipo: "MANODOPERA", descrizione: "", quantita: 1, prezzoUnitario: 0 }]);
  const [error, setError] = useState(null);

  const setItem = (idx, field, value) => {
    setItems(items.map((it, i) => (i === idx ? { ...it, [field]: value } : it)));
  };
  const addItem = () => setItems([...items, { tipo: "MANODOPERA", descrizione: "", quantita: 1, prezzoUnitario: 0 }]);
  const removeItem = (idx) => setItems(items.filter((_, i) => i !== idx));

  const imponibile = items.reduce((sum, it) => sum + Number(it.quantita || 0) * Number(it.prezzoUnitario || 0), 0);
  const totale = imponibile * (1 + Number(aliquotaIva || 0) / 100);

  const submit = async () => {
    setError(null);
    try {
      await api("/api/quotes", {
        method: "POST",
        body: JSON.stringify({
          clientId,
          vehicleId,
          aliquotaIva: Number(aliquotaIva),
          items: items.map((it) => ({
            ...it,
            quantita: Number(it.quantita),
            prezzoUnitario: Number(it.prezzoUnitario),
          })),
        }),
      });
      onDone();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 120px", gap: 10, marginBottom: 14 }}>
        <select value={clientId} onChange={(e) => setClientId(e.target.value)} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }}>
          {clients.length === 0 && <option value="">Crea prima un cliente</option>}
          {clients.map((c) => <option key={c.id} value={c.id}>{c.nome} {c.cognome}</option>)}
        </select>
        <select value={vehicleId} onChange={(e) => setVehicleId(e.target.value)} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }}>
          {vehicles.length === 0 && <option value="">Crea prima un veicolo</option>}
          {vehicles.map((v) => <option key={v.id} value={v.id}>{v.marca} {v.modello} — {v.targa}</option>)}
        </select>
        <input type="number" value={aliquotaIva} onChange={(e) => setAliquotaIva(e.target.value)}
          placeholder="IVA %" style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: "#4A4842", marginBottom: 8 }}>Voci</div>
      {items.map((it, idx) => (
        <div key={idx} style={{ display: "grid", gridTemplateColumns: "130px 1fr 80px 100px 28px", gap: 8, marginBottom: 8 }}>
          <select value={it.tipo} onChange={(e) => setItem(idx, "tipo", e.target.value)} style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }}>
            {QUOTE_ITEM_TIPI.map((t) => <option key={t.key} value={t.key}>{t.label}</option>)}
          </select>
          <input placeholder="Descrizione" value={it.descrizione} onChange={(e) => setItem(idx, "descrizione", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }} />
          <input type="number" placeholder="Qtà" value={it.quantita} onChange={(e) => setItem(idx, "quantita", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }} />
          <input type="number" placeholder="Prezzo €" value={it.prezzoUnitario} onChange={(e) => setItem(idx, "prezzoUnitario", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }} />
          <button onClick={() => removeItem(idx)} disabled={items.length === 1} style={{
            border: "none", background: "#F1EFE8", borderRadius: 7, fontSize: 13, color: "#B4472E",
          }}>✕</button>
        </div>
      ))}
      <button onClick={addItem} style={{
        border: "1px dashed #D9D5CA", background: "transparent", borderRadius: 7, padding: "6px 12px", fontSize: 12, color: "#8D9099", marginBottom: 12,
      }}>+ Aggiungi voce</button>

      <div style={{ textAlign: "right", fontSize: 13, color: "#4A4842", marginBottom: 12 }}>
        Imponibile: {euro(imponibile)} &nbsp;·&nbsp; Totale con IVA: <strong>{euro(totale)}</strong>
      </div>

      {error && <div style={{ color: "#B4472E", fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13 }}>Salva</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13 }}>Annulla</button>
      </div>
    </div>
  );
}

/* ---------------- MAGAZZINO VIEW ---------------- */
function MagazzinoView({ api }) {
  const [parts, setParts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState("");
  const [soloSottoScorta, setSoloSottoScorta] = useState(false);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    const query = new URLSearchParams();
    if (search) query.set("search", search);
    if (soloSottoScorta) query.set("sottoScorta", "true");
    api(`/api/parts?${query.toString()}`)
      .then(setParts)
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, [api, search, soloSottoScorta]);

  useEffect(load, [load]);

  const sottoScortaCount = parts.filter((p) => p.giacenza <= p.scortaMinima).length;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, fontWeight: 700 }}>Magazzino</h1>
        <button onClick={() => setShowForm(true)} style={{
          padding: "8px 14px", borderRadius: 8, border: "none", background: "#C9A24B", color: "#15171B", fontSize: 13, fontWeight: 600,
        }}>+ Nuovo ricambio</button>
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginBottom: 16 }}>{error}</div>}

      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 16 }}>
        <input
          placeholder="Cerca per codice o descrizione…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          style={{ flex: 1, padding: "8px 10px", borderRadius: 8, border: "1px solid #2A2E34", fontSize: 13, background: "#1B1E23", color: "#F3F1EC" }}
        />
        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#4A4842", whiteSpace: "nowrap" }}>
          <input type="checkbox" checked={soloSottoScorta} onChange={(e) => setSoloSottoScorta(e.target.checked)} />
          Solo sotto scorta {sottoScortaCount > 0 && !soloSottoScorta ? `(${sottoScortaCount})` : ""}
        </label>
      </div>

      {showForm && (
        <NewPartForm api={api} onDone={() => { setShowForm(false); load(); }} onCancel={() => setShowForm(false)} />
      )}

      {loading ? <Loading /> : (
        <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, overflow: "hidden" }}>
          {parts.length === 0 && <div style={{ padding: 20, fontSize: 13, color: "#8D9099" }}>Nessun ricambio trovato.</div>}
          {parts.map((p, i) => {
            const sottoScorta = p.giacenza <= p.scortaMinima;
            return (
              <div key={p.id} onClick={() => setSelectedId(p.id)} style={{
                display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", cursor: "pointer",
                borderTop: i === 0 ? "none" : "1px solid #F1EFE8",
              }}>
                <div style={{ width: 4, height: 32, borderRadius: 4, background: sottoScorta ? "#D64545" : "#2F8F5B" }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{p.descrizione}</div>
                  <div style={{ fontSize: 12, color: "#8D9099" }}>Codice: {p.codice}{p.fornitore ? ` · ${p.fornitore}` : ""}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: sottoScorta ? "#D64545" : "#F3F1EC" }}>
                    {p.giacenza} pz
                  </div>
                  <div style={{ fontSize: 11, color: "#8D9099" }}>scorta min. {p.scortaMinima}</div>
                </div>
                <div style={{ fontSize: 13, fontWeight: 600, minWidth: 70, textAlign: "right" }}>{euro(p.prezzoAcquisto)}</div>
              </div>
            );
          })}
        </div>
      )}

      {selectedId && (
        <PartDetailModal
          partId={selectedId}
          api={api}
          onClose={() => setSelectedId(null)}
          onChanged={load}
        />
      )}
    </div>
  );
}

function NewPartForm({ api, onDone, onCancel }) {
  const [form, setForm] = useState({
    codice: "", descrizione: "", giacenza: 0, scortaMinima: 0,
    prezzoAcquisto: "", prezzoVendita: "", fornitore: "",
  });
  const [error, setError] = useState(null);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const submit = async () => {
    setError(null);
    try {
      await api("/api/parts", {
        method: "POST",
        body: JSON.stringify({
          codice: form.codice,
          descrizione: form.descrizione,
          giacenza: Number(form.giacenza) || 0,
          scortaMinima: Number(form.scortaMinima) || 0,
          prezzoAcquisto: Number(form.prezzoAcquisto) || 0,
          ...(form.prezzoVendita ? { prezzoVendita: Number(form.prezzoVendita) } : {}),
          ...(form.fornitore ? { fornitore: form.fornitore } : {}),
        }),
      });
      onDone();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        <Field label="Codice ricambio" value={form.codice} onChange={set("codice")} />
        <Field label="Fornitore" value={form.fornitore} onChange={set("fornitore")} />
      </div>
      <Field label="Descrizione" value={form.descrizione} onChange={set("descrizione")} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }}>
        <Field label="Giacenza iniziale" type="number" value={form.giacenza} onChange={set("giacenza")} />
        <Field label="Scorta minima" type="number" value={form.scortaMinima} onChange={set("scortaMinima")} />
        <Field label="Prezzo acquisto €" type="number" value={form.prezzoAcquisto} onChange={set("prezzoAcquisto")} />
        <Field label="Prezzo vendita €" type="number" value={form.prezzoVendita} onChange={set("prezzoVendita")} />
      </div>

      {error && <div style={{ color: "#B4472E", fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13 }}>Salva</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13 }}>Annulla</button>
      </div>
    </div>
  );
}

function PartDetailModal({ partId, api, onClose, onChanged }) {
  const [part, setPart] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [movQuantita, setMovQuantita] = useState(1);
  const [saving, setSaving] = useState(false);

  const load = useCallback(() => {
    setLoading(true);
    api(`/api/parts/${partId}`).then(setPart).catch((e) => setError(e.message)).finally(() => setLoading(false));
  }, [api, partId]);

  useEffect(load, [load]);

  const registraMovimento = async (tipo) => {
    setError(null);
    setSaving(true);
    try {
      await api(`/api/parts/${partId}/movements`, {
        method: "POST",
        body: JSON.stringify({ tipo, quantita: Number(movQuantita) }),
      });
      await load();
      onChanged();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  const elimina = async () => {
    if (!confirm("Eliminare definitivamente questo ricambio?")) return;
    try {
      await api(`/api/parts/${partId}`, { method: "DELETE" });
      onChanged();
      onClose();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(27,26,23,0.5)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#15171B", borderRadius: 16, width: 480, maxHeight: "85vh", overflowY: "auto", padding: 24,
      }}>
        {loading || !part ? <Loading /> : (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
              <div>
                <div style={{ fontFamily: "monospace", fontSize: 12, background: "#F1EFE8", display: "inline-block", padding: "2px 7px", borderRadius: 5 }}>{part.codice}</div>
                <h2 style={{ fontSize: 18, fontWeight: 700, margin: "8px 0 2px" }}>{part.descrizione}</h2>
                {part.fornitore && <div style={{ fontSize: 13, color: "#8D9099" }}>{part.fornitore}</div>}
              </div>
              <button onClick={onClose} style={{
                border: "none", background: "#F1EFE8", width: 28, height: 28, borderRadius: 8, fontSize: 15, color: "#4A4842",
              }}>✕</button>
            </div>

            {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginTop: 12 }}>{error}</div>}

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 20 }}>
              <div style={{ background: "#0A0B0D", borderRadius: 10, padding: 12 }}>
                <div style={{ fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Giacenza attuale</div>
                <div style={{ fontSize: 20, fontWeight: 700, color: part.giacenza <= part.scortaMinima ? "#D64545" : "#F3F1EC" }}>
                  {part.giacenza} pz
                </div>
                <div style={{ fontSize: 11, color: "#8D9099" }}>scorta minima: {part.scortaMinima}</div>
              </div>
              <div style={{ background: "#0A0B0D", borderRadius: 10, padding: 12 }}>
                <div style={{ fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Prezzi</div>
                <div style={{ fontSize: 13 }}>Acquisto: <strong>{euro(part.prezzoAcquisto)}</strong></div>
                <div style={{ fontSize: 13 }}>Vendita: <strong>{part.prezzoVendita ? euro(part.prezzoVendita) : "—"}</strong></div>
              </div>
            </div>

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 24, marginBottom: 10 }}>Registra movimento</h3>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input type="number" min="1" value={movQuantita} onChange={(e) => setMovQuantita(e.target.value)}
                style={{ width: 80, padding: 8, borderRadius: 8, border: "1px solid #2A2E34", fontSize: 13 }} />
              <button disabled={saving} onClick={() => registraMovimento("CARICO")} style={{
                padding: "8px 14px", borderRadius: 8, border: "none", background: "#2F8F5B", color: "#15171B", fontSize: 13, fontWeight: 600,
              }}>+ Carico</button>
              <button disabled={saving} onClick={() => registraMovimento("SCARICO")} style={{
                padding: "8px 14px", borderRadius: 8, border: "none", background: "#C9A24B", color: "#15171B", fontSize: 13, fontWeight: 600,
              }}>− Scarico</button>
            </div>

            {part.movements && part.movements.length > 0 && (
              <>
                <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 24, marginBottom: 10 }}>Ultimi movimenti</h3>
                <div style={{ border: "1px solid #2A2E34", borderRadius: 10, overflow: "hidden" }}>
                  {part.movements.map((m, i) => (
                    <div key={m.id} style={{
                      display: "flex", justifyContent: "space-between", padding: "8px 12px", fontSize: 12,
                      borderTop: i === 0 ? "none" : "1px solid #F1EFE8",
                    }}>
                      <span style={{ color: m.tipo === "CARICO" ? "#2F8F5B" : "#C9A24B", fontWeight: 600 }}>
                        {m.tipo === "CARICO" ? "+ " : "− "}{m.quantita} pz
                      </span>
                      <span style={{ color: "#8D9099" }}>{new Date(m.createdAt).toLocaleDateString("it-IT")}</span>
                    </div>
                  ))}
                </div>
              </>
            )}

            <button onClick={elimina} style={{

function AutoSostitutiveView({ api }) {
  const [cars, setCars] = useState([]);

  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [error, setError] = useState(null);

    setLoading(true);
    Promise.all([api("/api/loaner-cars"), api("/api/clients")])
      .then(([c, cl]) => { setCars(c); setClients(cl); })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, [api]);

  useEffect(load, [load]);

  if (loading) return <Loading />;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, fontWeight: 700 }}>Auto sostitutive</h1>

            <div key={c.id} onClick={() => setSelectedId(c.id)} style={{

              <div style={{ fontSize: 14, fontWeight: 600, marginTop: 8 }}>{c.marca} {c.modello}</div>

                <div style={{ fontSize: 12, color: "#8D9099", marginTop: 4 }}>

function LoanerCarDetailModal({ carId, api, clients, onClose, onChanged }) {
  const [car, setCar] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [clientId, setClientId] = useState("");
  const [saving, setSaving] = useState(false);

  const load = useCallback(() => {
    setLoading(true);
    api(`/api/loaner-cars/${carId}`).then(setCar).catch((e) => setError(e.message)).finally(() => setLoading(false));
  }, [api, carId]);

  useEffect(load, [load]);

  const prenotazioneAttiva = car?.bookings?.find((b) => !b.dataFine);

  const assegna = async () => {
    if (!clientId) return;
    setError(null);
    setSaving(true);
    try {
      await api(`/api/loaner-cars/${carId}/bookings`, { method: "POST", body: JSON.stringify({ clientId }) });
      await load();
      onChanged();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  const registraRientro = async () => {
    setError(null);
    setSaving(true);
    try {
      await api(`/api/loaner-cars/${carId}/rientro`, { method: "PATCH" });
      await load();
      onChanged();
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  const elimina = async () => {
    if (!confirm("Eliminare definitivamente questa auto sostitutiva?")) return;
    try {
      await api(`/api/loaner-cars/${carId}`, { method: "DELETE" });
      onChanged();
      onClose();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(27,26,23,0.5)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#15171B", borderRadius: 16, width: 480, maxHeight: "85vh", overflowY: "auto", padding: 24,
      }}>
        {loading || !car ? <Loading /> : (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
              <div>
                <div style={{ fontFamily: "monospace", fontSize: 12, background: "#F1EFE8", display: "inline-block", padding: "2px 7px", borderRadius: 5 }}>{car.targa}</div>
                <h2 style={{ fontSize: 18, fontWeight: 700, margin: "8px 0 2px" }}>{car.marca} {car.modello}</h2>
              </div>
              <button onClick={onClose} style={{
                border: "none", background: "#F1EFE8", width: 28, height: 28, borderRadius: 8, fontSize: 15, color: "#4A4842",
              }}>✕</button>
            </div>

            {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginTop: 12 }}>{error}</div>}

            <div style={{ marginTop: 20 }}>
              {prenotazioneAttiva ? (
                <div style={{ background: "#FBEAE5", borderRadius: 10, padding: 12 }}>
                  <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 4 }}>Attualmente assegnata a</div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>
                    {(() => {
                      const cl = clients.find((c) => c.id === prenotazioneAttiva.clientId);
                      return cl ? `${cl.nome} ${cl.cognome}` : "Cliente";
                    })()}
                  </div>
                  <div style={{ fontSize: 12, color: "#8D9099" }}>dal {new Date(prenotazioneAttiva.dataInizio).toLocaleDateString("it-IT")}</div>
                  <button disabled={saving} onClick={registraRientro} style={{
                    marginTop: 10, padding: "8px 14px", borderRadius: 8, border: "none", background: "#2F8F5B", color: "#15171B", fontSize: 13, fontWeight: 600,
                  }}>Registra rientro</button>
                </div>
              ) : (
                <div style={{ background: "#0A0B0D", borderRadius: 10, padding: 12 }}>
                  <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 8 }}>Assegna a un cliente</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <select value={clientId} onChange={(e) => setClientId(e.target.value)} style={{
                      flex: 1, padding: 8, borderRadius: 8, border: "1px solid #2A2E34", fontSize: 13,
                    }}>
                      <option value="">Seleziona cliente…</option>
                      {clients.map((c) => <option key={c.id} value={c.id}>{c.nome} {c.cognome}</option>)}
                    </select>
                    <button disabled={saving || !clientId} onClick={assegna} style={{
                      padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600,
                    }}>Assegna</button>
                  </div>
                </div>
              )}
            </div>

            {car.bookings && car.bookings.length > 0 && (
              <>
                <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 24, marginBottom: 10 }}>Storico utilizzi</h3>
                <div style={{ border: "1px solid #2A2E34", borderRadius: 10, overflow: "hidden" }}>
                  {car.bookings.map((b, i) => {
                    const cl = clients.find((c) => c.id === b.clientId);
                    return (
                      <div key={b.id} style={{
                        display: "flex", justifyContent: "space-between", padding: "8px 12px", fontSize: 12,
                        borderTop: i === 0 ? "none" : "1px solid #F1EFE8",
                      }}>
                        <span>{cl ? `${cl.nome} ${cl.cognome}` : "Cliente"}</span>
                        <span style={{ color: "#8D9099" }}>
                          {new Date(b.dataInizio).toLocaleDateString("it-IT")}
                          {b.dataFine ? ` → ${new Date(b.dataFine).toLocaleDateString("it-IT")}` : " (in corso)"}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </>
            )}

            <button onClick={elimina} style={{
              marginTop: 20, padding: "7px 14px", borderRadius: 8, border: "1px solid #FBEAE5", background: "#15171B", color: "#B4472E", fontSize: 12,
            }}>Elimina auto</button>
          </>
        )}
      </div>
    </div>
  );
}

function NewSupplierOrderForm({ parts, api, onDone, onCancel }) {
  const [fornitore, setFornitore] = useState("");
  const [note, setNote] = useState("");
  const [items, setItems] = useState([{ partId: "", descrizione: "", quantitaOrdinata: 1, prezzoUnitario: 0 }]);
  const [error, setError] = useState(null);

  const setItem = (idx, field, value) => {
    setItems(items.map((it, i) => {
      if (i !== idx) return it;
      const updated = { ...it, [field]: value };
      // Se seleziono un ricambio esistente, precompilo la descrizione
      // per velocizzare l'inserimento, restando comunque modificabile.
      if (field === "partId" && value) {
        const part = parts.find((p) => p.id === value);
        if (part) updated.descrizione = part.descrizione;
      }
      return updated;
    }));
  };
  const addItem = () => setItems([...items, { partId: "", descrizione: "", quantitaOrdinata: 1, prezzoUnitario: 0 }]);
  const removeItem = (idx) => setItems(items.filter((_, i) => i !== idx));

  const submit = async () => {
    setError(null);
    try {
      await api("/api/supplier-orders", {
        method: "POST",
        body: JSON.stringify({
          fornitore,
          note: note || undefined,
          items: items.map((it) => ({
            partId: it.partId || undefined,
            descrizione: it.descrizione,
            quantitaOrdinata: Number(it.quantitaOrdinata),
            prezzoUnitario: it.prezzoUnitario ? Number(it.prezzoUnitario) : undefined,
          })),
        }),
      });
      onDone();
    } catch (e) {
      setError(e.message);
    }
  };

  return (
    <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        <Field label="Fornitore" value={fornitore} onChange={(e) => setFornitore(e.target.value)} />
        <Field label="Note (opzionale)" value={note} onChange={(e) => setNote(e.target.value)} />
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: "#4A4842", marginBottom: 8 }}>Voci ordine</div>
      {items.map((it, idx) => (
        <div key={idx} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 70px 90px 28px", gap: 8, marginBottom: 8 }}>
          <select value={it.partId} onChange={(e) => setItem(idx, "partId", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }}>
            <option value="">Ricambio non a magazzino</option>
            {parts.map((p) => <option key={p.id} value={p.id}>{p.codice} — {p.descrizione}</option>)}
          </select>
          <input placeholder="Descrizione" value={it.descrizione} onChange={(e) => setItem(idx, "descrizione", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }} />
          <input type="number" placeholder="Qtà" value={it.quantitaOrdinata} onChange={(e) => setItem(idx, "quantitaOrdinata", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }} />
          <input type="number" placeholder="Prezzo €" value={it.prezzoUnitario} onChange={(e) => setItem(idx, "prezzoUnitario", e.target.value)}
            style={{ padding: 7, borderRadius: 7, border: "1px solid #2A2E34", fontSize: 13 }} />
          <button onClick={() => removeItem(idx)} disabled={items.length === 1} style={{
            border: "none", background: "#F1EFE8", borderRadius: 7, fontSize: 13, color: "#B4472E",
          }}>✕</button>
        </div>
      ))}
      <button onClick={addItem} style={{
        border: "1px dashed #D9D5CA", background: "transparent", borderRadius: 7, padding: "6px 12px", fontSize: 12, color: "#8D9099", marginBottom: 12,
      }}>+ Aggiungi voce</button>

      {error && <div style={{ color: "#B4472E", fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13 }}>Salva</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13 }}>Annulla</button>
      </div>
    </div>
  );
}

/* ---------------- CALENDARIO VIEW ---------------- */
const TIPO_APPUNTAMENTO = [
  { key: "CLIENTE", label: "Cliente (consegna/ritiro)", color: "#2F8F5B" },
  { key: "INTERNO", label: "Lavorazione interna", color: "#C9A24B" },
];
const tipoOf = (key) => TIPO_APPUNTAMENTO.find((t) => t.key === key) || TIPO_APPUNTAMENTO[0];

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day; // lunedì come primo giorno
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function fmtGiorno(date) {
  return date.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
}

function fmtOra(date) {
  return new Date(date).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
}

function toInputDateTime(date) {
  const d = new Date(date);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function CalendarioView({ api, token }) {
  const [weekStart, setWeekStart] = useState(startOfWeek(new Date()));
  const [appointments, setAppointments] = useState([]);
  const [clients, setClients] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [error, setError] = useState(null);

  const weekEnd = addDays(weekStart, 7);
  const giorni = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(weekStart, i));

  const load = useCallback(() => {
    setLoading(true);
    const from = weekStart.toISOString();
    const to = weekEnd.toISOString();
    Promise.all([
      api(`/api/appointments?from=${from}&to=${to}`),
      api("/api/clients"),
      api("/api/vehicles"),
      api("/api/users"),
    ])
      .then(([a, c, v, u]) => {
        setAppointments(a);
        setClients(c);
        setVehicles(v);
        setUsers(u);
      })
      .finally(() => setLoading(false));
  }, [api, weekStart]);

  useEffect(load, [load]);

  const eliminaAppuntamento = async (id) => {
    if (!confirm("Eliminare questo appuntamento?")) return;
    await api(`/api/appointments/${id}`, { method: "DELETE" });
    load();
  };

  const appuntamentiDelGiorno = (giorno) =>
    appointments
      .filter((a) => {
        const d = new Date(a.inizio);
        return (
          d.getFullYear() === giorno.getFullYear() &&
          d.getMonth() === giorno.getMonth() &&
          d.getDate() === giorno.getDate()
        );
      })
      .sort((a, b) => new Date(a.inizio) - new Date(b.inizio));

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ fontSize: 20, fontWeight: 700 }}>Calendario</h1>
        <button
          onClick={() => setShowForm(true)}
          style={{
          background: "#C9A24B",
          color: "#15171B",
          border: "none",
          borderRadius: 8,
          padding: "9px 16px",
          fontSize: 14,
          fontWeight: 600,
}}
        >
          + Nuovo appuntamento
        </button>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
        <button
          onClick={() => setWeekStart(addDays(weekStart, -7))}
          style={{ background: "#15171B", color: "#F3F1EC", border: "1px solid #2A2E34", borderRadius: 8, padding: "6px 12px", fontSize: 13 }}
       >
          ← Settimana prec.
        </button>
        <button
          onClick={() => setWeekStart(startOfWeek(new Date()))}
          style={{ background: "#15171B", color: "#F3F1EC", border: "1px solid #2A2E34", borderRadius: 8, padding: "6px 12px", fontSize: 13 }}
        >
          Oggi
        </button>
        <button
          onClick={() => setWeekStart(addDays(weekStart, 7))}
          style={{ background: "#15171B", color: "#F3F1EC", border: "1px solid #2A2E34", borderRadius: 8, padding: "6px 12px", fontSize: 13 }}
        >
          Settimana succ. →
        </button>
        <span style={{ fontSize: 13, color: "#8D9099", marginLeft: 8 }}>
          {fmtGiorno(giorni[0])} — {fmtGiorno(giorni[6])}
        </span>
      </div>

      {loading ? (
        <Loading />
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 10 }}>
          {giorni.map((giorno, i) => {
            const oggi = new Date();
            const isOggi =
              giorno.getFullYear() === oggi.getFullYear() &&
              giorno.getMonth() === oggi.getMonth() &&
              giorno.getDate() === oggi.getDate();
            return (
              <div
                key={i}
                style={{
                  background: "#15171B",
                  border: isOggi ? "1.5px solid #F3F1EC" : "1px solid #2A2E34",
                  borderRadius: 10,
                  padding: 10,
                  minHeight: 160,
                }}
              >
                <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 8, textTransform: "capitalize" }}>
                  {fmtGiorno(giorno)}
                </div>
                {appuntamentiDelGiorno(giorno).map((a) => {
                  const t = tipoOf(a.tipo);
                  return (
                    <div
                      key={a.id}
                      onClick={() => eliminaAppuntamento(a.id)}
                      title="Clicca per eliminare"
                      style={{
                        background: t.color + "22",
                        borderLeft: `3px solid ${t.color}`,
                        borderRadius: 6,
                        padding: "6px 8px",
                        marginBottom: 6,
                        cursor: "pointer",
                        fontSize: 12,
                      }}
                    >
                      <div style={{ fontWeight: 600 }}>{fmtOra(a.inizio)} · {a.titolo}</div>
                      {a.client && (
                        <div style={{ color: "#8D9099" }}>{a.client.nome} {a.client.cognome}</div>
                      )}
                      {a.vehicle && (
                        <div style={{ color: "#8D9099" }}>{a.vehicle.marca} {a.vehicle.modello} · {a.vehicle.targa}</div>
                      )}
                      {a.tecnico && (
                        <div style={{ color: "#8D9099" }}>Tecnico: {a.tecnico.nome} {a.tecnico.cognome}</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {showForm && (
        <NuovoAppuntamentoForm
          api={api}
          clients={clients}
          vehicles={vehicles}
          users={users}
          defaultDate={weekStart}
          onClose={() => setShowForm(false)}
          onDone={() => {
            setShowForm(false);
            load();
          }}
        />
      )}
    </div>
  );
}

  ATTESA_APPROVAZIONE: "Preventivo pronto per approvazione",
  ORDINE_RICAMBI: "Ricambi in ordinazione",

  PREPARAZIONE: "Veicolo in preparazione",
  VERNICIATURA: "Verniciatura completata",
  LUCIDATURA: "Veicolo in lucidatura",
  CONTROLLO_QUALITA: "Controllo qualità in corso",
  LAVAGGIO: "Veicolo in fase di lavaggio",
  PRONTA_CONSEGNA: "Vettura pronta",
  CONSEGNATA: "Vettura consegnata",
  RICAMBIO_RITARDO: "Ricambio in ritardo",
};
const WHATSAPP_STATO_STYLE = {
  INVIATO: { label: "Inviato", color: "#8D9099" },
  CONSEGNATO: { label: "Consegnato", color: "#4E7F8C" },
  LETTO: { label: "Letto", color: "#2F8F5B" },

  RISPOSTA_RICEVUTA: { label: "Risposta ricevuta", color: "#C9A24B" },
};

// Pannello nella scheda veicolo: registro dei messaggi WhatsApp inviati per
// questa pratica (data/ora, stato consegna, eventuale errore/risposta) e
// pulsante per segnalare manualmente un ritardo ricambio al cliente
// (non è un cambio di stato della pratica, quindi resta una scelta
// dell'operatore caso per caso).
function WhatsappPanel({ vehicleId, api }) {
  const [messaggi, setMessaggi] = useState([]);
  const [loading, setLoading] = useState(true);
  const [inviando, setInviando] = useState(false);
  const [avviso, setAvviso] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    api(`/api/whatsapp/vehicles/${vehicleId}/messages`).then(setMessaggi).catch(() => setMessaggi([])).finally(() => setLoading(false));
  }, [api, vehicleId]);

  useEffect(load, [load]);

  const segnalaRitardo = async () => {
    setAvviso(null);
    setInviando(true);
    try {
      await api(`/api/whatsapp/vehicles/${vehicleId}/ricambio-ritardo`, { method: "POST" });
      load();
    } catch (e) {
      setAvviso(e.message);
    } finally {
      setInviando(false);
    }
  };

  return (
    <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontSize: 12, color: "#8D9099" }}>Registro dei messaggi WhatsApp inviati automaticamente sui cambi di stato di questa pratica.</div>
        <button onClick={segnalaRitardo} disabled={inviando} style={{
          padding: "7px 12px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap",
        }}>{inviando ? "Invio…" : "Segnala ricambio in ritardo"}</button>
      </div>

      {avviso && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 10 }}>{avviso}</div>}

      {loading ? <Loading /> : messaggi.length === 0 ? (
        <div style={{ fontSize: 12, color: "#8D9099" }}>Nessun messaggio WhatsApp inviato finora per questa pratica.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {messaggi.map((m) => {
            const stile = WHATSAPP_STATO_STYLE[m.stato] || WHATSAPP_STATO_STYLE.INVIATO;
            return (
              <div key={m.id} style={{ border: "1px solid #2A2E34", borderRadius: 10, padding: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 6 }}>
                  <span style={{ fontSize: 12.5, fontWeight: 700 }}>{WHATSAPP_EVENTO_LABEL[m.evento] || m.evento}</span>
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: stile.color, border: `1px solid ${stile.color}`, borderRadius: 20, padding: "2px 8px" }}>{stile.label}</span>
                </div>
                <div style={{ fontSize: 11, color: "#8D9099", marginTop: 3 }}>{new Date(m.createdAt).toLocaleString("it-IT")} · {m.telefono}</div>
                <div style={{ fontSize: 12, color: "#D9D6CE", marginTop: 6, whiteSpace: "pre-wrap" }}>{m.testo}</div>
                {m.errore && <div style={{ fontSize: 11.5, color: "#B4472E", marginTop: 6 }}>Errore: {m.errore}</div>}
                {m.rispostaTesto && (
                  <div style={{ fontSize: 12, color: "#C9A24B", marginTop: 8, borderTop: "1px solid #2A2E34", paddingTop: 6 }}>
                    Risposta cliente ({new Date(m.rispostaAt).toLocaleString("it-IT")}): {m.rispostaTesto}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const WHATSAPP_VARIABILI = ["nome_cliente", "veicolo", "targa", "numero_pratica", "stato", "data_consegna", "link_portale"];

// Schermata Admin: decide quali cambi di stato generano una comunicazione
// WhatsApp automatica e con quale testo (personalizzabile per tenant).
function WhatsappSettingsView({ api }) {
  const [templates, setTemplates] = useState(null);
  const [saving, setSaving] = useState({});
  const [saved, setSaved] = useState({});
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    api("/api/whatsapp/templates").then(setTemplates).catch((e) => setError(e.message));
  }, [api]);

  useEffect(load, [load]);

  const updateLocal = (evento, patch) => {
    setTemplates((prev) => prev.map((t) => (t.evento === evento ? { ...t, ...patch } : t)));
  };

  const salva = async (t) => {
    setSaving((s) => ({ ...s, [t.evento]: true }));
    setSaved((s) => ({ ...s, [t.evento]: false }));
    setError(null);
    try {
      await api(`/api/whatsapp/templates/${t.evento}`, {
        method: "PUT",
        body: JSON.stringify({ attivo: t.attivo, testo: t.testo }),
      });
      setSaved((s) => ({ ...s, [t.evento]: true }));
      setTimeout(() => setSaved((s) => ({ ...s, [t.evento]: false })), 2500);
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving((s) => ({ ...s, [t.evento]: false }));
    }
  };

  if (!templates) return <Loading />;

  return (
    <div>
      <h1 style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>WhatsApp — comunicazioni automatiche</h1>
      <div style={{ fontSize: 12.5, color: "#8D9099", marginBottom: 8, maxWidth: 720 }}>
        Attiva per ogni cambio di stato della pratica se generare o meno un messaggio WhatsApp automatico al cliente, e personalizza il testo. Il messaggio parte solo se il cliente ha dato il consenso alle notifiche (scheda cliente) e ha un numero di telefono.
      </div>
      <div style={{ fontSize: 11.5, color: "#6B6963", marginBottom: 18, maxWidth: 720 }}>
        Variabili disponibili: {WHATSAPP_VARIABILI.map((v) => `{{${v}}}`).join("  ")}
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 14 }}>{error}</div>}

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {templates.map((t) => (
          <div key={t.evento} style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{t.label}</div>
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, cursor: "pointer" }}>
                <input type="checkbox" checked={t.attivo} onChange={(e) => updateLocal(t.evento, { attivo: e.target.checked })} />
                {t.attivo ? "Attivo" : "Disattivato"}
              </label>
            </div>
            <textarea
              value={t.testo}
              onChange={(e) => updateLocal(t.evento, { testo: e.target.value })}
              rows={3}
              style={{ width: "100%", padding: 10, borderRadius: 8, border: "1px solid #2A2E34", background: "#0A0B0D", color: "#F3F1EC", fontSize: 12.5, fontFamily: "inherit", resize: "vertical" }}
            />
            <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10 }}>
              <button onClick={() => salva(t)} disabled={saving[t.evento]} style={{
                padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 12.5, fontWeight: 600,
              }}>{saving[t.evento] ? "Salvataggio…" : "Salva"}</button>

              {!t.personalizzato && <span style={{ fontSize: 11, color: "#6B6963" }}>Testo di default, non ancora personalizzato</span>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

};

      api(`/api/vehicles/${vehicleId}/portal-documents`),

  }, [api, vehicleId]);

  useEffect(load, [load]);

  const caricaDocumento = async (file) => {

    setError(null);
    setCaricando(true);

      await api(`/api/portal-documents/${id}`, { method: "DELETE" });

  const richiesteAperte = azioni.filter((a) => ["RICHIESTA_CONTATTO", "RICHIESTA_RITIRO"].includes(a.tipo) && !a.gestita);

          {richiesteAperte.map((a) => (
            <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, padding: "6px 0", borderTop: "1px solid #2A2E34" }}>
              <div>
                <div style={{ fontSize: 12.5, fontWeight: 600 }}>{PORTAL_ACTION_LABEL[a.tipo] || a.tipo}</div>
                {a.messaggio && <div style={{ fontSize: 12, color: "#D9D6CE", marginTop: 2 }}>{a.messaggio}</div>}
                {a.dataRichiesta && <div style={{ fontSize: 12, color: "#D9D6CE", marginTop: 2 }}>Data richiesta: {new Date(a.dataRichiesta).toLocaleString("it-IT")}</div>}
                <div style={{ fontSize: 11, color: "#8D9099", marginTop: 2 }}>{new Date(a.createdAt).toLocaleString("it-IT")}</div>
              </div>
              <button onClick={() => segnaGestita(a.id)} style={{
                padding: "5px 10px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 11.5, fontWeight: 600, whiteSpace: "nowrap",
              }}>Segna gestita</button>

      <div style={{ fontSize: 12, color: "#4A4842", marginBottom: 8, marginTop: 16 }}>Documenti condivisi con il cliente:</div>
      {documenti.length === 0 && <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 10 }}>Nessun documento caricato.</div>}
      {documenti.map((d) => (
        <div key={d.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid #2A2E34", fontSize: 12.5 }}>

            <div style={{ fontSize: 11, color: "#8D9099" }}>
              {d.richiedeFirma ? (d.firmatoAt ? `Firmato da ${d.firmatarioNome} il ${new Date(d.firmatoAt).toLocaleString("it-IT")}` : "In attesa di firma") : "Nessuna firma richiesta"}

        <input type="checkbox" checked={richiedeFirma} onChange={(e) => setRichiedeFirma(e.target.checked)} />

  NORMALE: { label: "Normale", color: "#4E7F8C" },

};
const WO_STATO_STYLE = {
  DA_INIZIARE: { label: "Da iniziare", color: "#8D9099" },
  IN_CORSO: { label: "In corso", color: "#2F8F5B" },
  IN_PAUSA: { label: "In pausa", color: "#C9A24B" },
  COMPLETATA: { label: "Completata", color: "#4E7F8C" },
};
const REPARTO_LABEL = { CARROZZERIA: "Carrozzeria", MECCANICA: "Meccanica", VERNICIATURA: "Verniciatura", FINITURA: "Finitura" };

function formatOre(h) {
  const n = Number(h || 0);
  const ore = Math.floor(n);
  const min = Math.round((n - ore) * 60);
  return `${ore}h ${String(min).padStart(2, "0")}m`;
}

// Ore reali "vive": somma i segmenti chiusi (già inclusi in oreReali dal
// server) più il tempo trascorso dal segmento aperto, se c'è, calcolato
// lato client con un tick a intervalli regolari — nessuna chiamata di
// rete extra solo per far scorrere un cronometro.
function useOreLive(workOrder, tick) {
  return useMemo(() => {
    const aperto = (workOrder.timeEntries || []).find((e) => !e.fine);
    if (!aperto) return workOrder.oreReali;
    const extra = (Date.now() - new Date(aperto.inizio).getTime()) / 3_600_000;
    return workOrder.oreReali + Math.max(0, extra);
  }, [workOrder, tick]);
}

          <div style={{ fontSize: 16, fontWeight: 700, color: "#F3F1EC" }}>{wo.vehicle?.marca} {wo.vehicle?.modello}</div>
        </div>
        <span style={{ fontSize: 11, fontWeight: 700, padding: "4px 10px", borderRadius: 20, background: stato.color + "22", color: stato.color, whiteSpace: "nowrap" }}>{stato.label}</span>
      </div>

      <div style={{ fontSize: 14.5, fontWeight: 600, color: "#F3F1EC", marginBottom: 6 }}>{wo.titolo}</div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
        <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 9px", borderRadius: 20, background: prio.color + "22", color: prio.color }}>{prio.label}</span>
        <span style={{ fontSize: 11, padding: "3px 9px", borderRadius: 20, background: "#0A0B0D", color: "#8D9099", border: "1px solid #2A2E34" }}>{REPARTO_LABEL[wo.reparto] || wo.reparto}</span>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 12.5, color: "#D9D6CE", marginBottom: 10 }}>

        {wo.dataConsegna && <div style={{ gridColumn: "1 / -1" }}>Consegna prevista: <strong>{new Date(wo.dataConsegna).toLocaleDateString("it-IT")}</strong></div>}
      </div>

      {wo.noteTecniche && (

        )}
        {wo.stato === "IN_PAUSA" && (
          <button disabled={azionando} onClick={() => onAzione(wo.id, "inizia")} style={{ flex: 1, padding: "12px 14px", borderRadius: 10, border: "none", background: "#2F8F5B", color: "#fff", fontSize: 14.5, fontWeight: 700, minHeight: 46 }}>▶ RIPRENDI</button>
        )}
        {wo.stato === "IN_CORSO" && (
          <button disabled={azionando} onClick={() => onAzione(wo.id, "pausa")} style={{ flex: 1, padding: "12px 14px", borderRadius: 10, border: "1px solid #C9A24B", background: "#15171B", color: "#C9A24B", fontSize: 14.5, fontWeight: 700, minHeight: 46 }}>⏸ PAUSA</button>

          <button disabled={azionando} onClick={() => onAzione(wo.id, "termina")} style={{ flex: 1, padding: "12px 14px", borderRadius: 10, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 14.5, fontWeight: 700, minHeight: 46 }}>✓ TERMINA</button>

function CorrezioneTempoForm({ entry, api, onDone, onCancel }) {
  const toLocalInput = (iso) => iso ? new Date(new Date(iso).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
  const [inizio, setInizio] = useState(toLocalInput(entry.inizio));
  const [fine, setFine] = useState(toLocalInput(entry.fine));
  const [motivo, setMotivo] = useState("");
  const [error, setError] = useState(null);
  const [salvando, setSalvando] = useState(false);

  const salva = async () => {
    if (!motivo.trim()) { setError("Indica il motivo della correzione."); return; }
    setSalvando(true);
    setError(null);
    try {
      await api(`/api/work-order-time-entries/${entry.id}`, {
        method: "PATCH",
        body: JSON.stringify({ inizio: new Date(inizio).toISOString(), fine: fine ? new Date(fine).toISOString() : null, motivo: motivo.trim() }),
      });
      onDone();
    } catch (e) { setError(e.message); } finally { setSalvando(false); }
  };

  return (
    <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 8, padding: 10, marginTop: 6 }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
        <input type="datetime-local" value={inizio} onChange={(e) => setInizio(e.target.value)} style={{ flex: 1, padding: 6, borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12 }} />
        <input type="datetime-local" value={fine} onChange={(e) => setFine(e.target.value)} style={{ flex: 1, padding: 6, borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12 }} />
      </div>
      <input placeholder="Motivo della correzione (obbligatorio)" value={motivo} onChange={(e) => setMotivo(e.target.value)} style={{ width: "100%", padding: 6, borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12, marginBottom: 6, boxSizing: "border-box" }} />
      {error && <div style={{ color: "#E5806B", fontSize: 11.5, marginBottom: 6 }}>{error}</div>}
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={salva} disabled={salvando} style={{ padding: "5px 10px", borderRadius: 6, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 11.5, fontWeight: 600 }}>{salvando ? "Salvataggio…" : "Salva correzione"}</button>
        <button onClick={onCancel} style={{ padding: "5px 10px", borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 11.5 }}>Annulla</button>
      </div>
    </div>
  );
}

          <div style={{ fontSize: 11, fontWeight: 700, color: "#8D9099", margin: "10px 0 6px" }}>Storico modifiche</div>
          {!eventi ? <Loading /> : eventi.length === 0 ? <div style={{ fontSize: 11.5, color: "#6B6963" }}>Nessun evento.</div> : eventi.map((ev) => (
            <div key={ev.id} style={{ fontSize: 11.5, color: "#8D9099", marginBottom: 3 }}>
              {new Date(ev.createdAt).toLocaleString("it-IT")} — {ev.tipo}{ev.attore ? ` (${ev.attore.nome} ${ev.attore.cognome})` : ""}
              {ev.dettagli?.motivo ? `: ${ev.dettagli.motivo}` : ""}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function NuovaLavorazioneForm({ vehicleId, api, tecnici, onDone, onCancel }) {
  const [form, setForm] = useState({ titolo: "", reparto: "CARROZZERIA", tecnicoId: tecnici[0]?.id || "", priorita: "NORMALE", oreStimate: "", noteTecniche: "", dataConsegna: "" });
  const [error, setError] = useState(null);
  const [salvando, setSalvando] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const salva = async () => {
    if (!form.titolo.trim() || !form.tecnicoId || !form.oreStimate) { setError("Compila titolo, tecnico e ore previste."); return; }
    setSalvando(true);
    setError(null);
    try {
      await api(`/api/vehicles/${vehicleId}/work-orders`, {
        method: "POST",
        body: JSON.stringify({
          titolo: form.titolo.trim(), reparto: form.reparto, tecnicoId: form.tecnicoId, priorita: form.priorita,
          oreStimate: Number(form.oreStimate), noteTecniche: form.noteTecniche || undefined,
          dataConsegna: form.dataConsegna ? new Date(form.dataConsegna).toISOString() : undefined,
        }),
      });
      onDone();
    } catch (e) { setError(e.message); } finally { setSalvando(false); }
  };

  return (
    <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 10, padding: 12, marginBottom: 12 }}>
      <input placeholder="Lavorazione (es. Sostituzione paraurti)" value={form.titolo} onChange={set("titolo")} style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5, marginBottom: 8, boxSizing: "border-box" }} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
        <select value={form.reparto} onChange={set("reparto")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
          {Object.keys(REPARTO_LABEL).map((r) => <option key={r} value={r}>{REPARTO_LABEL[r]}</option>)}
        </select>
        <select value={form.tecnicoId} onChange={set("tecnicoId")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
          {tecnici.map((t) => <option key={t.id} value={t.id}>{t.nome} {t.cognome}</option>)}
        </select>
        <select value={form.priorita} onChange={set("priorita")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
          {Object.keys(PRIORITA_STYLE).map((p) => <option key={p} value={p}>{PRIORITA_STYLE[p].label}</option>)}
        </select>
        <input type="number" step="0.5" min="0" placeholder="Ore previste" value={form.oreStimate} onChange={set("oreStimate")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }} />
      </div>
      <input type="datetime-local" value={form.dataConsegna} onChange={set("dataConsegna")} style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5, marginBottom: 8, boxSizing: "border-box" }} />
      <textarea placeholder="Note tecniche per il tecnico" value={form.noteTecniche} onChange={set("noteTecniche")} rows={2} style={{ width: "100%", padding: 8, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5, marginBottom: 8, boxSizing: "border-box", fontFamily: "inherit" }} />
      {error && <div style={{ color: "#E5806B", fontSize: 12, marginBottom: 8 }}>{error}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={salva} disabled={salvando} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 12.5, fontWeight: 600 }}>{salvando ? "Creazione…" : "Assegna lavorazione"}</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>Annulla</button>
      </div>
    </div>
  );
}

function WorkOrdersPanel({ vehicleId, api, ruolo }) {
  const [lavorazioni, setLavorazioni] = useState(null);
  const [tecnici, setTecnici] = useState([]);
  const [oreLavorate, setOreLavorate] = useState(null);
  const [mostraForm, setMostraForm] = useState(false);
  const [error, setError] = useState(null);

  const load = useCallback(() => {
    Promise.all([
      api(`/api/vehicles/${vehicleId}/work-orders`),
      api("/api/users"),
      api(`/api/vehicles/${vehicleId}/ore-lavorate`),
    ]).then(([wo, users, ore]) => { setLavorazioni(wo); setTecnici(users.filter((u) => u.ruolo === "TECNICO")); setOreLavorate(ore); }).catch((e) => setError(e.message));
  }, [api, vehicleId]);
  useEffect(load, [load]);

  if (!lavorazioni) return <div style={{ marginTop: 12 }}><Loading /></div>;

  return (
    <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 10 }}>{error}</div>}

      {mostraForm ? (
        tecnici.length === 0 ? (
          <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 10 }}>Nessun tecnico attivo nel tenant: creane uno da Registro utenti prima di assegnare una lavorazione.</div>
        ) : (
          <NuovaLavorazioneForm vehicleId={vehicleId} api={api} tecnici={tecnici} onDone={() => { setMostraForm(false); load(); }} onCancel={() => setMostraForm(false)} />
        )
      ) : (
        <button onClick={() => setMostraForm(true)} style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600 }}>+ Assegna lavorazione</button>
      )}

      {lavorazioni.length === 0 ? (
        <div style={{ fontSize: 12, color: "#8D9099", marginTop: 12 }}>Nessuna lavorazione assegnata su questa pratica.</div>
      ) : lavorazioni.map((wo) => <WorkOrderRow key={wo.id} wo={wo} api={api} ruolo={ruolo} onChanged={load} />)}

      {oreLavorate && oreLavorate.some((o) => o.ore > 0) && (
        <div style={{ fontSize: 11, color: "#6B6963", marginTop: 14, borderTop: "1px solid #2A2E34", paddingTop: 10 }}>
          Ore reali tracciate per reparto (riferimento per Profit Tracker e Predictive Delay AI, non inserite automaticamente): {oreLavorate.filter((o) => o.ore > 0).map((o) => `${REPARTO_LABEL[o.reparto]} ${formatOre(o.ore)}`).join(" · ")}
        </div>
      )}
    </div>
  );
}

/* ---------------- CARROZZERIA LIVE: board officina/TV ---------------- */
const SEMAFORO_STYLE = { verde: { color: "#2F8F5B", label: "Regolare" }, arancione: { color: "#C9A24B", label: "Attenzione" }, rosso: { color: "#B4472E", label: "Problema/ritardo" } };

function isOggi(d) { if (!d) return false; const x = new Date(d), o = new Date(); return x.toDateString() === o.toDateString(); }
function isQuestaSettimana(d) {
  if (!d) return false;
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const o = new Date(); o.setHours(0, 0, 0, 0);
  const fine = new Date(o); fine.setDate(fine.getDate() + (7 - o.getDay() || 7));
  return x >= o && x <= fine;
}

function CarrozzeriaLiveView({ api }) {
  const [righe, setRighe] = useState(null);
  const [error, setError] = useState(null);
  const [modalitaOfficina, setModalitaOfficina] = useState(true);
  const [fullscreen, setFullscreen] = useState(false);
  const [filtri, setFiltri] = useState({ reparto: "", tecnicoId: "", stato: "", oggi: false, settimana: false, bloccate: false });
  const containerRef = useRef(null);

  const load = useCallback(() => {
    api("/api/live-dashboard").then(setRighe).catch((e) => setError(e.message));
  }, [api]);

  useEffect(load, [load]);
  useEffect(() => {
    const id = setInterval(load, 30000); // aggiornamento automatico ogni 30s
    return () => clearInterval(id);
  }, [load]);

  useEffect(() => {
    const onChange = () => setFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onChange);
    return () => document.removeEventListener("fullscreenchange", onChange);
  }, []);

  const entraFullscreen = () => { containerRef.current?.requestFullscreen?.(); };
  const esciFullscreen = () => { if (document.fullscreenElement) document.exitFullscreen(); };

  // In fullscreen (monitor visibile a chiunque in officina) la Modalità
  // Officina è sempre attiva, a prescindere da cosa lo staff aveva scelto.
  const officinaEffettiva = fullscreen || modalitaOfficina;

  const tecniciDisponibili = useMemo(() => {
    if (!righe) return [];
    const map = new Map();
    righe.forEach((r) => { if (r.tecnico) map.set(r.tecnico.id, r.tecnico); });
    return [...map.values()];
  }, [righe]);

  const righeFiltrate = useMemo(() => {
    if (!righe) return [];
    const oggiFine = new Date(); oggiFine.setDate(oggiFine.getDate() + 1);
    return righe.filter((r) => {
      if (filtri.reparto && r.reparto !== filtri.reparto) return false;
      if (filtri.tecnicoId && r.tecnico?.id !== filtri.tecnicoId) return false;
      if (filtri.stato && r.stage !== filtri.stato) return false;
      if (filtri.oggi && !isOggi(r.dataConsegna)) return false;
      if (filtri.settimana && !isQuestaSettimana(r.dataConsegna)) return false;
      if (filtri.bloccate && !r.blocco.attivo) return false;
      return true;
    });
  }, [righe, filtri]);

  const fontBase = fullscreen ? 20 : 13.5;

  if (!righe) return <Loading />;

  return (
    <div ref={containerRef} style={{ background: fullscreen ? "#0A0B0D" : "transparent", minHeight: fullscreen ? "100vh" : "auto", padding: fullscreen ? 28 : 0 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: fullscreen ? 20 : 14 }}>
        <div>
          <h1 style={{ fontSize: fullscreen ? 30 : 20, fontWeight: 700, margin: 0 }}>Carrozzeria Live</h1>
          {!fullscreen && <div style={{ fontSize: 12, color: "#8D9099", marginTop: 4 }}>Si aggiorna automaticamente ogni 30 secondi.</div>}
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, fontSize: fullscreen ? 14 : 11.5 }}>
            {Object.entries(SEMAFORO_STYLE).map(([k, s]) => (
              <span key={k} style={{ display: "flex", alignItems: "center", gap: 4, color: "#8D9099" }}>
                <span style={{ width: 10, height: 10, borderRadius: 99, background: s.color, display: "inline-block" }} /> {s.label}
              </span>
            ))}
          </div>
          {!fullscreen && (
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#D9D6CE", cursor: "pointer" }}>
              <input type="checkbox" checked={modalitaOfficina} onChange={(e) => setModalitaOfficina(e.target.checked)} />
              Modalità officina (nasconde i dati del cliente)
            </label>
          )}
          {!fullscreen ? (
            <button onClick={entraFullscreen} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 12.5, fontWeight: 600 }}>⛶ Schermo intero (TV)</button>
          ) : (
            <button onClick={esciFullscreen} style={{ padding: "9px 18px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 14, fontWeight: 600 }}>Esci da schermo intero</button>
          )}
        </div>
      </div>

      {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 12 }}>{error}</div>}

      {!fullscreen && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
          <select value={filtri.reparto} onChange={(e) => setFiltri({ ...filtri, reparto: e.target.value })} style={{ padding: 7, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
            <option value="">Tutti i reparti</option>
            {Object.keys(REPARTO_LABEL).map((r) => <option key={r} value={r}>{REPARTO_LABEL[r]}</option>)}
          </select>
          <select value={filtri.tecnicoId} onChange={(e) => setFiltri({ ...filtri, tecnicoId: e.target.value })} style={{ padding: 7, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
            <option value="">Tutti i tecnici</option>
            {tecniciDisponibili.map((t) => <option key={t.id} value={t.id}>{t.nome} {t.cognome}</option>)}
          </select>
          <select value={filtri.stato} onChange={(e) => setFiltri({ ...filtri, stato: e.target.value })} style={{ padding: 7, borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC", fontSize: 12.5 }}>
            <option value="">Tutti gli stati</option>
            {Object.keys(STAGE_LABELS_LIVE).map((s) => <option key={s} value={s}>{STAGE_LABELS_LIVE[s]}</option>)}
          </select>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, padding: "0 6px", cursor: "pointer" }}>
            <input type="checkbox" checked={filtri.oggi} onChange={(e) => setFiltri({ ...filtri, oggi: e.target.checked, settimana: false })} /> Consegne oggi
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, padding: "0 6px", cursor: "pointer" }}>
            <input type="checkbox" checked={filtri.settimana} onChange={(e) => setFiltri({ ...filtri, settimana: e.target.checked, oggi: false })} /> Consegne questa settimana
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, padding: "0 6px", cursor: "pointer" }}>
            <input type="checkbox" checked={filtri.bloccate} onChange={(e) => setFiltri({ ...filtri, bloccate: e.target.checked })} /> Solo vetture bloccate
          </label>
        </div>
      )}

      <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1.3fr 1.2fr 0.9fr 1.3fr 1.4fr", gap: 8, padding: fullscreen ? "16px 20px" : "10px 14px", borderBottom: "1px solid #2A2E34", fontSize: fontBase * 0.6, fontWeight: 700, color: "#8D9099", textTransform: "uppercase", letterSpacing: "0.03em" }}>
          <div>Veicolo</div><div>Stato</div><div>Tecnico</div><div>Consegna</div><div>Avanzamento</div><div>Blocco</div>
        </div>
        {righeFiltrate.length === 0 ? (
          <div style={{ padding: 30, textAlign: "center", color: "#8D9099", fontSize: fontBase }}>Nessuna pratica corrisponde ai filtri.</div>
        ) : righeFiltrate.map((r) => (
          <div key={r.vehicleId} style={{ display: "grid", gridTemplateColumns: "1.6fr 1.3fr 1.2fr 0.9fr 1.3fr 1.4fr", gap: 8, alignItems: "center", padding: fullscreen ? "16px 20px" : "10px 14px", borderBottom: "1px solid #2A2E34", fontSize: fontBase }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
              <span style={{ width: 11, height: 11, borderRadius: 99, background: SEMAFORO_STYLE[r.semaforo].color, flexShrink: 0 }} title={SEMAFORO_STYLE[r.semaforo].label} />
              <div style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.veicolo}</div>
                <div style={{ fontSize: fontBase * 0.75, color: "#8D9099", fontFamily: "monospace" }}>{r.targa}</div>
                {!officinaEffettiva && r.cliente && (
                  <div style={{ fontSize: fontBase * 0.7, color: "#6B6963", marginTop: 2 }}>{r.cliente.nome} {r.cliente.cognome}{r.cliente.telefono ? ` · ${r.cliente.telefono}` : ""}</div>
                )}
              </div>
            </div>
            <div>{r.stato}</div>
            <div style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.tecnico ? `${r.tecnico.nome} ${r.tecnico.cognome}` : "—"}</div>
            <div>{r.dataConsegna ? new Date(r.dataConsegna).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" }) : "—"}</div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ flex: 1, height: fullscreen ? 10 : 7, borderRadius: 20, background: "#0A0B0D", overflow: "hidden" }}>
                  <div style={{ width: `${r.avanzamento}%`, height: "100%", background: SEMAFORO_STYLE[r.semaforo].color, borderRadius: 20 }} />
                </div>
                <span style={{ fontSize: fontBase * 0.8, color: "#D9D6CE", flexShrink: 0 }}>{r.avanzamento}%</span>
              </div>
            </div>
            <div style={{ color: r.blocco.attivo ? "#E5806B" : "#6B6963", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              {r.blocco.attivo ? `🔴 ${r.blocco.descrizione || "Bloccato"}` : "—"}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
