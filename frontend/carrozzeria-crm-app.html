<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

/* ---------------- CONFIG ---------------- */
const API = ["127.0.0.1", "localhost"].includes(window.location.hostname) && window.location.port === "4310" ? window.location.origin : "https://carrozzeria-crm-backend-production.up.railway.app";

const STAGES = [
  { key: "ACCETTAZIONE", label: "Accettazione", color: "#9C9890" },
  { key: "PREVENTIVO", label: "Preventivo", color: "#A79C86" },
  { key: "ATTESA_APPROVAZIONE", label: "Attesa approvazione", color: "#B39A6E" },
  { key: "ORDINE_RICAMBI", label: "Ordine ricambi", color: "#BE9257" },
  { key: "IN_LAVORAZIONE", label: "In lavorazione", color: "#C88A44" },
  { key: "PREPARAZIONE", label: "Preparazione", color: "#D18333" },
  { key: "VERNICIATURA", label: "Verniciatura", color: "#DB7A24" },
  { key: "LUCIDATURA", label: "Lucidatura", color: "#E4722E" },
  { key: "CONTROLLO_QUALITA", label: "Controllo qualità", color: "#C9A24B" },
  { key: "LAVAGGIO", label: "Lavaggio", color: "#4E7F8C" },
  { key: "PRONTA_CONSEGNA", label: "Pronta consegna", color: "#2F8F5B" },
  { key: "CONSEGNATA", label: "Consegnata", color: "#6B6963" },
];
const stageOf = (key) => STAGES.find((s) => s.key === key) || STAGES[0];
const euro = (n) => Number(n || 0).toLocaleString("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });

/* ---------------- API HELPER ---------------- */
function useApi(token) {
  return useCallback(async (path, options = {}) => {
    const {responseType,...fetchOptions}=options;
    const multipart=options.body instanceof FormData;
    const res = await fetch(`${API}${path}`, {
      ...fetchOptions,
      headers: {
        ...(!multipart?{"Content-Type":"application/json"}:{}),
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
        ...(options.headers || {}),
      },
    });
    if(res.ok&&responseType==="blob")return res.blob();
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error ? JSON.stringify(data.error) : "Errore di rete");
    return data;
  }, [token]);
}

// L'upload foto usa multipart/form-data, quindi non passa dall'helper JSON
// sopra (che imposta sempre Content-Type: application/json).
async function uploadPhoto(token, vehicleId, file, fase) {
  const body = new FormData();
  body.append("file", file);
  body.append("fase", fase);
  const res = await fetch(`${API}/api/vehicles/${vehicleId}/photos`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}` },
    body,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error ? JSON.stringify(data.error) : "Errore durante il caricamento");
  return data;
}

// Il download del PDF richiede il token Bearer, quindi non si può usare
// un semplice link <a href>: scarichiamo il file come blob e lo salviamo.
async function downloadQuotePdf(token, quoteId, filename) {
  const res = await fetch(`${API}/api/quotes/${quoteId}/pdf`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) {
    // Mostriamo il messaggio di errore reale restituito dal server,
    // invece di un generico "errore durante il caricamento".
    const text = await res.text().catch(() => "");
    throw new Error(`Errore generazione PDF (${res.status}): ${text.slice(0, 300)}`);
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
function App() {
  const [token, setToken] = useState(null);
  const [connError, setConnError] = useState(false);

  if (!token) return <AuthScreen onAuth={setToken} connError={connError} setConnError={setConnError} />;
  return <Dashboard token={token} onLogout={() => setToken(null)} />;
}

/* ---------------- LOGIN / REGISTER ---------------- */
function AuthScreen({ onAuth, connError, setConnError }) {
  const [mode, setMode] = useState("login");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const api = useApi(null);

  const [form, setForm] = useState({
    ragioneSociale: "Carrozzeria Nova Srl",
    nomeAdmin: "Mario",
    cognomeAdmin: "Rossi",
    email: "admin@carrozzeria-nova.it",
    password: "password123!",
  });

  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const submit = async () => {
    setLoading(true);
    setError(null);
    setConnError(false);
    try {
      const path = mode === "login" ? "/api/auth/login" : "/api/auth/register";
      const body = mode === "login" ? { email: form.email, password: form.password } : form;
      const data = await api(path, { method: "POST", body: JSON.stringify(body) });
      onAuth(data.token);
    } catch (e) {
      if (e.message.includes("Failed to fetch")) setConnError(true);
      else setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ width: 380, background: "#15171B", border: "1px solid #2A2E34", borderRadius: 16, padding: 32 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 24 }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: "#C9A24B" }} />
          <span style={{ fontWeight: 700, fontSize: 17 }}>Rifless</span>
        </div>

        {connError && (
          <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginBottom: 16 }}>
            Non riesco a contattare il server su <code>carrozzeria-crm-backend-production.up.railway.app</code>. Controlla la connessione a internet o riprova tra qualche istante.
          </div>
        )}

        <div style={{ display: "flex", gap: 4, marginBottom: 20, background: "#0A0B0D", borderRadius: 10, padding: 4 }}>
          {["login", "register"].map((m) => (
            <button key={m} onClick={() => setMode(m)} style={{
              flex: 1, padding: "8px 0", borderRadius: 8, border: "none", fontSize: 13, fontWeight: 600,
              background: mode === m ? "#F3F1EC" : "transparent", color: mode === m ? "#15171B" : "#8D9099",
            }}>{m === "login" ? "Accedi" : "Nuova carrozzeria"}</button>
          ))}
        </div>

        {mode === "register" && (
          <>
            <Field label="Ragione sociale" value={form.ragioneSociale} onChange={set("ragioneSociale")} />
            <Field label="Nome" value={form.nomeAdmin} onChange={set("nomeAdmin")} />
            <Field label="Cognome" value={form.cognomeAdmin} onChange={set("cognomeAdmin")} />
          </>
        )}
        <Field label="Email" value={form.email} onChange={set("email")} />
        <Field label="Password" type="password" value={form.password} onChange={set("password")} />

        {error && <div style={{ color: "#B4472E", fontSize: 13, marginBottom: 8 }}>{error}</div>}

        <button onClick={submit} disabled={loading} style={{
          width: "100%", marginTop: 8, padding: "11px 0", borderRadius: 10, border: "none",
          background: "#F3F1EC", color: "#15171B", fontWeight: 600, fontSize: 14,
        }}>
          {loading ? "Attendere…" : mode === "login" ? "Accedi" : "Crea carrozzeria"}
        </button>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, type = "text" }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <label style={{ display: "block", fontSize: 11, color: "#8D9099", marginBottom: 4 }}>{label}</label>
      <input type={type} value={value} onChange={onChange} style={{
        width: "100%", padding: "9px 10px", borderRadius: 8, border: "1px solid #2A2E34", fontSize: 14,
      }} />
    </div>
  );
}

/* ---------------- DASHBOARD SHELL ---------------- */
// Il JWT non è cifrato, solo firmato: leggere il suo contenuto lato client
// è sicuro per decidere COSA MOSTRARE nell'interfaccia (comodità), ma non
// sostituisce mai i controlli reali, che restano lato server con
// requireRole — un utente smaliziato potrebbe comunque forzare le
// richieste HTTP dirette, ed è lì che serve la vera protezione.
function decodificaRuolo(token) {
  try {
    const payloadBase64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    const payload = JSON.parse(atob(payloadBase64));
    return payload.role || null;
  } catch {
    return null;
  }
}

const RUOLI_CON_ACCESSO_FINANZIARIO = ["ADMIN", "AMMINISTRAZIONE"];

const NAV_BASE = [

  { key: "veicoli", label: "Veicoli" },

  { key: "clienti", label: "Clienti" },
];

function Dashboard({ token, onLogout }) {

        {tab === "parts-tracking" && <PartsDashboard api={api} onOpen={apriPraticaVeicolo} />}
        {tab === "delay" && <DelayDashboard api={api} ruolo={ruolo} onOpen={apriPraticaVeicolo} />}
        {tab === "profit" && ["ADMIN","AMMINISTRAZIONE"].includes(ruolo) && <ProfitDashboard api={api} ruolo={ruolo} onOpen={apriPraticaVeicolo} />}

/* ---------------- DASHBOARD VIEW ---------------- */
const MESI_IT = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
const meseLabel = (key) => {
  const [y, m] = key.split("-");
  return `${MESI_IT[Number(m) - 1]} ${y}`;
};

// Carica un endpoint "BI" in modo isolato: se la route non esiste ancora
// sul backend (perché non è stato ancora ridispiegato con le nuove route),
// il resto della dashboard continua a funzionare e questa sezione mostra
// solo un avviso, invece di far fallire tutto il caricamento.
function useBiEndpoint(api, path) {
  const [state, setState] = useState({ status: path ? "loading" : "non-autorizzato", data: null });
  useEffect(() => {
    if (!path) { setState({ status: "non-autorizzato", data: null }); return; }
    let cancelled = false;
    setState({ status: "loading", data: null });
    api(path)
      .then((data) => { if (!cancelled) setState({ status: "ok", data }); })
      .catch(() => { if (!cancelled) setState({ status: "error", data: null }); });
    return () => { cancelled = true; };
  }, [api, path]);
  return state;
}

// Grafico a barre verticali (per serie temporali, es. fatturato mensile).
function BarChart({ data, height = 170, barColor = "#C9A24B", formatValue = (v) => v, formatLabel = (l) => l }) {
  if (!data || data.length === 0) {
    return <div style={{ padding: 20, fontSize: 13, color: "#8D9099" }}>Nessun dato disponibile ancora.</div>;
  }
  const max = Math.max(...data.map((d) => d.value), 1);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height, padding: "0 4px" }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", height: "100%", justifyContent: "flex-end" }}>
          <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 4 }}>{formatValue(d.value)}</div>
          <div style={{
            width: "100%", maxWidth: 48, borderRadius: "6px 6px 0 0",
            background: barColor, height: `${Math.max((d.value / max) * (height - 40), 3)}px`,
          }} />
          <div style={{ fontSize: 11, color: "#8D9099", marginTop: 6, textAlign: "center" }}>{formatLabel(d.label)}</div>
        </div>
      ))}
    </div>
  );
}

// Lista di barre orizzontali (per classifiche, es. tempi per stage, top ricambi).
function HBarList({ data, formatValue = (v) => v, barColor = "#4E7F8C" }) {
  if (!data || data.length === 0) {
    return <div style={{ padding: 20, fontSize: 13, color: "#8D9099" }}>Nessun dato disponibile ancora.</div>;
  }
  const max = Math.max(...data.map((d) => d.value), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {data.map((d, i) => (
        <div key={i}>

}

// Riquadro dove firmare col dito (tablet) o col mouse. Riutilizzato sia
// per l'accettazione dei preventivi sia per la firma di consegna veicolo.
function FirmaModal({ titolo, sottotitolo, onSalva, onAnnulla, salvando, errore }) {
  const canvasRef = useRef(null);
  const disegnando = useRef(false);
  const [nome, setNome] = useState("");
  const [vuoto, setVuoto] = useState(true);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  const inizia = (e) => {
    e.preventDefault();
    disegnando.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const disegna = (e) => {
    if (!disegnando.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getPos(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#F3F1EC";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.stroke();
    setVuoto(false);
  };
  const fine = () => { disegnando.current = false; };

  const pulisci = () => {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    setVuoto(true);
  };

  const conferma = () => {
    if (vuoto || !nome.trim() || salvando) return;
    onSalva(canvasRef.current.toDataURL("image/png"), nome.trim());
  };

  return (
    <div onClick={(e) => { e.stopPropagation(); onAnnulla(); }} style={{
      position: "fixed", inset: 0, background: "rgba(27,26,23,0.5)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 70, padding: 16,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#15171B", borderRadius: 16, width: 460, maxWidth: "100%", padding: 24,
      }}>
        <h2 style={{ fontSize: 17, fontWeight: 700, margin: "0 0 2px" }}>{titolo}</h2>
        {sottotitolo && <div style={{ fontSize: 13, color: "#8D9099", marginBottom: 16 }}>{sottotitolo}</div>}

        <label style={{ display: "block", fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Nome di chi firma</label>
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome e cognome" style={{
          width: "100%", padding: 9, borderRadius: 8, border: "1px solid #2A2E34", fontSize: 14, marginBottom: 14, boxSizing: "border-box",
        }} />

        <label style={{ display: "block", fontSize: 11, color: "#8D9099", marginBottom: 4 }}>Firma qui sotto (col dito o col mouse)</label>
        <canvas
          ref={canvasRef}
          width={412} height={160}
          style={{ width: "100%", height: 160, border: "1.5px dashed #D9D5CA", borderRadius: 8, touchAction: "none", background: "#0A0B0D", display: "block" }}
          onMouseDown={inizia} onMouseMove={disegna} onMouseUp={fine} onMouseLeave={fine}
          onTouchStart={inizia} onTouchMove={disegna} onTouchEnd={fine}
        />
        <button onClick={pulisci} style={{
          marginTop: 8, padding: "5px 10px", borderRadius: 6, border: "1px solid #2A2E34", background: "#15171B", fontSize: 12, color: "#4A4842",
        }}>Cancella firma</button>

        {errore && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 9, borderRadius: 8, marginTop: 12 }}>{errore}</div>}

        <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
          <button onClick={conferma} disabled={vuoto || !nome.trim() || salvando} style={{
            padding: "9px 16px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600,
            opacity: vuoto || !nome.trim() ? 0.5 : 1,
          }}>{salvando ? "Salvataggio…" : "Conferma firma"}</button>
          <button onClick={onAnnulla} style={{
            padding: "9px 16px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13,
          }}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- AI DAMAGE ASSISTANT ----------------
   Modulo separato dalla vecchia "Stima danni IA" qui sopra (che resta
   invariata): qui ogni danno è una riga a sé, sempre correggibile, da cui
   si può generare direttamente una bozza di preventivo (mai inviata o
   accettata automaticamente: resta sempre una bozza da rivedere). */
const GRAVITA_INFO = {
  LIEVE: { emoji: "🟢", label: "Lieve", color: "#2F8F5B" },
  MEDIA: { emoji: "🟠", label: "Media", color: "#C9A24B" },
  GRAVE: { emoji: "🔴", label: "Grave", color: "#B4472E" },
};
const TIPO_VOCE_LABEL = { MANODOPERA: "Manodopera", RICAMBIO: "Ricambio", VERNICE: "Vernice", ALTRO: "Altro" };

function AiDamageAssistant({ vehicle, api, token, onVehicleReload }) {
  const [analisi, setAnalisi] = useState([]);
  const [loadingAnalisi, setLoadingAnalisi] = useState(true);
  const [fotoSelezionate, setFotoSelezionate] = useState([]);
  const [caricandoFoto, setCaricandoFoto] = useState(false);
  const [analizzando, setAnalizzando] = useState(false);
  const [errore, setErrore] = useState(null);
  const [itemsSelezionati, setItemsSelezionati] = useState({});
  const [generandoBozza, setGenerandoBozza] = useState(false);
  const [bozzaCreata, setBozzaCreata] = useState(null);
  const [modificheLocali, setModificheLocali] = useState({});
  const [salvandoId, setSalvandoId] = useState(null);

  const caricaAnalisi = useCallback(async () => {
    setLoadingAnalisi(true);
    try {
      const data = await api(`/api/vehicles/${vehicle.id}/damage-assistant`);
      setAnalisi(data);
      if (data[0]) {
        const sel = {};
        data[0].items.forEach((it) => (sel[it.id] = true));
        setItemsSelezionati(sel);
      }
    } catch (e) {
      // Sezione facoltativa: un errore di caricamento non deve bloccare il resto della pratica.
    } finally {
      setLoadingAnalisi(false);
    }
  }, [api, vehicle.id]);

  useEffect(() => { caricaAnalisi(); }, [caricaAnalisi]);

  const fotoPrima = (vehicle.photos || []).filter((p) => p.fase === "PRIMA");

  const toggleFoto = (id) => {
    setFotoSelezionate((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const caricaNuoveFoto = async (files) => {
    if (!files || files.length === 0) return;
    setErrore(null);
    setCaricandoFoto(true);
    try {
      const nuoviIds = [];
      for (const file of Array.from(files)) {
        const p = await uploadPhoto(token, vehicle.id, file, "PRIMA");
        nuoviIds.push(p.id);
      }
      // Ricarica "silenziosa": aggiorna vehicle.photos senza mostrare la
      // schermata di caricamento a pieno modale, che smonterebbe questo
      // componente e azzererebbe la selezione appena fatta.
      await onVehicleReload({ silent: true });
      setFotoSelezionate((prev) => [...prev, ...nuoviIds]);
    } catch (e) {
      setErrore(e.message);
    } finally {
      setCaricandoFoto(false);
    }
  };

  const analizzaDanni = async () => {
    if (fotoSelezionate.length === 0) return;
    setErrore(null);
    setAnalizzando(true);
    setBozzaCreata(null);
    try {
      const nuova = await api(`/api/vehicles/${vehicle.id}/damage-assistant/analizza`, {
        method: "POST",
        body: JSON.stringify({ photoIds: fotoSelezionate }),
      });
      setAnalisi((prev) => [nuova, ...prev]);
      const sel = {};
      nuova.items.forEach((it) => (sel[it.id] = true));
      setItemsSelezionati(sel);
      setFotoSelezionate([]);
    } catch (e) {
      setErrore(e.message);
    } finally {
      setAnalizzando(false);
    }
  };

  const aggiornaCampo = (itemId, campo, valore) => {
    setModificheLocali((prev) => ({ ...prev, [itemId]: { ...(prev[itemId] || {}), [campo]: valore } }));
  };

  const salvaCorrezioni = async (item) => {
    const modifiche = modificheLocali[item.id];
    if (!modifiche) return;
    setSalvandoId(item.id);
    setErrore(null);
    try {
      const aggiornato = await api(`/api/damage-items/${item.id}`, { method: "PATCH", body: JSON.stringify(modifiche) });
      setAnalisi((prev) => prev.map((a) => ({ ...a, items: a.items.map((it) => (it.id === item.id ? aggiornato : it)) })));
      setModificheLocali((prev) => { const p = { ...prev }; delete p[item.id]; return p; });
    } catch (e) {
      setErrore(e.message);
    } finally {
      setSalvandoId(null);
    }
  };

  const scartaItem = async (item) => {
    setErrore(null);
    try {
      await api(`/api/damage-items/${item.id}`, { method: "DELETE" });

                    <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, flexWrap: "wrap" }}>

                    </div>

                    <input value={valore("lavorazioneSuggerita") || ""} onChange={(e) => aggiornaCampo(item.id, "lavorazioneSuggerita", e.target.value)}

                    {item.vociPreventivo?.length > 0 && (
                      <div style={{ marginTop: 8, fontSize: 11, color: "#8D9099" }}>
                        {item.vociPreventivo.map((v, i) => (
                          <div key={i}>{TIPO_VOCE_LABEL[v.tipo] || v.tipo} — {v.descrizione} — {v.quantita} × {euro(v.prezzoUnitario)}</div>
                        ))}
                      </div>
                    )}

                    {item.noteOperatore && (
                      <div style={{ marginTop: 6, fontSize: 11, color: "#8D9099", fontStyle: "italic" }}>Nota: {item.noteOperatore}</div>
                    )}

                    <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                      {dirty && (
                        <button onClick={() => salvaCorrezioni(item)} disabled={salvandoId === item.id} style={{
                          fontSize: 11, fontWeight: 600, padding: "5px 10px", borderRadius: 6, border: "none", background: "#4E7F8C", color: "#fff",
                        }}>{salvandoId === item.id ? "Salvataggio…" : "Salva correzioni"}</button>
                      )}
                      <button onClick={() => scartaItem(item)} style={{
                        fontSize: 11, padding: "5px 10px", borderRadius: 6, border: "1px solid #2A2E34", background: "transparent", color: "#8D9099",
                      }}>Scarta</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}

          {bozzaCreata ? (
            <div style={{ background: "#2F8F5B22", color: "#2F8F5B", fontSize: 12, padding: 10, borderRadius: 8 }}>
              Bozza preventivo creata ({euro(bozzaCreata.totale)}) — vai su "Preventivi" per rivederla e inviarla al cliente.
            </div>
          ) : (
            <button onClick={generaBozzaPreventivo} disabled={generandoBozza || nessunaSelezione} style={{
              padding: "9px 14px", borderRadius: 8, border: "none",
              background: nessunaSelezione ? "#2A2E34" : "#C9A24B",
              color: nessunaSelezione ? "#6B6963" : "#15171B",
              fontSize: 13, fontWeight: 700, alignSelf: "flex-start", cursor: nessunaSelezione ? "default" : "pointer",
            }}>
              {generandoBozza ? "Generazione…" : "Genera bozza preventivo"}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

const profitMath = (() => {
const CATEGORIES = ["ricambi", "materiali", "vernici", "carrozziere", "verniciatore", "meccanico", "esterne", "trasporto", "sostitutiva", "altri"];
const DEFAULT_SETTINGS={criticalBelow:20,goodFrom:35};
function metrics(revenue, planned, actual, settings=DEFAULT_SETTINGS) {
 const pct = n => revenue === null || revenue === 0 ? null : n / revenue * 100;
 const plannedMargin = revenue === null ? null : revenue-planned;

 const actualPercent = pct(actualMargin);
 return {revenue,planned,actual,plannedMargin,actualMargin,plannedPercent:pct(plannedMargin),actualPercent,variance:planned-actual,
   status:actualPercent === null ? "unknown" : actualPercent < settings.criticalBelow ? "critical" : actualPercent < settings.goodFrom ? "watch" : "good"};
}
function calculate(data, quotes=[], settings=DEFAULT_SETTINGS) {
 const r = data.revenue;
 const quote = data.quoteId ? quotes.find(q=>q.id===data.quoteId && q.stato!=="RIFIUTATO") : null;
 const base = data.revenueMode === "payers" ? (r.assicurazione === null || r.cliente === null ? null : r.assicurazione+r.cliente) : data.quoteId ? (quote ? Math.round(Number(quote.imponibile)*100) : null) : r.preventivo;
 const revenue = base === null ? null : base+r.integrazioni+r.aggiuntivi+r.altri;
 const categories = CATEGORIES.map(category => {
   const sum = phase => data.costs.filter(c=>c.category===category && c.phase===phase).reduce((a,c)=>a+Math.round(c.quantity*c.unitCents),0);
   const planned=sum("planned"),actual=sum("actual");
   return {category,planned,actual,variance:planned-actual};
 });
 const planned=categories.reduce((a,c)=>a+c.planned,0), actual=categories.reduce((a,c)=>a+c.actual,0);
 return {...metrics(revenue,planned,actual,settings), categories, plannedComplete:data.plannedComplete,actualComplete:data.actualComplete,
   quoteStatus:quote?.stato??null, provisional:!data.actualComplete || !data.plannedComplete || revenue===null,
   note:"Importi IVA esclusa. Margine reale sui ricavi previsti e costi registrati; non equivale a utile netto o incassi."};
}
function groupKey(record, group) {
 const d=record.data.date, v=record.vehicle;
 if(group==="technician") return v.tecnicoId || "unassigned";
 if(group==="insurance") {
  const insurers=[...new Set((v.sinistri??[]).map(s=>s.compagniaAssicurativa).filter(Boolean))];
  return v.compagniaAssicurativa || (insurers.length===1?insurers[0]:insurers.length>1?"Più assicurazioni":"Non specificata");
 }
 if(group==="workType") return record.data.workType;
 if(group==="year") return d.slice(0,4);
 if(group==="month") return d.slice(0,7);
 if(group==="week") { const x=new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate() - (x.getUTCDay()+6)%7); return x.toISOString().slice(0,10); }
 return d;
}
function aggregate(records, group, settings) {
 const groups=new Map();
 for(const record of records) {
  const key=groupKey(record,group), m=calculate(record.data,record.vehicle.quotes,settings);
  if(!groups.has(key)) groups.set(key,{key,label:group==="technician" ? (record.vehicle.tecnico ? `${record.vehicle.tecnico.nome} ${record.vehicle.tecnico.cognome}` : "Non assegnato") : key,count:0,incomplete:0,missingRevenue:0,revenue:0,planned:0,actual:0});
  const g=groups.get(key); g.count++; g.incomplete+=Number(m.provisional); g.missingRevenue+=Number(m.revenue===null); g.revenue+=m.revenue??0; g.planned+=m.planned;g.actual+=m.actual;
 }
 return [...groups.values()].map(g=>({...g,...metrics(g.missingRevenue ? null:g.revenue,g.planned,g.actual,settings)})).sort((a,b)=>a.key.localeCompare(b.key));
}
return {calculate};
})();
const PROFIT_COSTS={ricambi:"Ricambi",materiali:"Materiali",vernici:"Vernici",carrozziere:"Ore carrozziere",verniciatore:"Ore verniciatore",meccanico:"Ore meccanico",esterne:"Lavorazioni esterne",trasporto:"Trasporto",sostitutiva:"Auto sostitutiva",altri:"Altri costi"};

const profitPct=n=>n===null||n===undefined?"—":n.toLocaleString("it-IT",{maximumFractionDigits:1})+"%";
function ProfitNumbers({m}) {
 if(!m) return <p>Nessuna pratica registrata nel periodo.</p>;

 return <><div className="profit-grid">{[["Ricavo previsto",m.revenue],["Costo previsto",m.planned],["Margine previsto",m.plannedMargin],["Costo reale registrato",m.actual],["Margine reale",m.actualMargin],["Scostamento margine",m.variance]].map(([label,value])=><div key={label} style={{padding:12,background:"#0A0B0D",borderRadius:8}}><div className="profit-muted">{label}</div><strong style={{fontSize:19}}>{profitEuro(value)}</strong>{label==="Margine previsto"&&<div>{profitPct(m.plannedPercent)}</div>}{label==="Margine reale"&&<div>{profitPct(m.actualPercent)}</div>}</div>)}</div>
 <p style={{color:status[1]}}>{status[0]}{(m.provisional||m.incomplete>0)?" · Valutazione provvisoria: costi o ricavi incompleti":""}</p>

}

 return <section className="profit-panel"><h3>Profit Tracker</h3><p className="profit-muted">{dirty?"Modifiche non salvate · anteprima aggiornata in tempo reale":"Dati salvati · aggiornamento ogni 30 secondi"}</p>{error&&<p role="alert" className="profit-error">{error}</p>}{notice&&<p role="status">{notice}</p>}

 {["planned","actual"].map(phase=><div key={phase}><h4>{phase==="planned"?"Costi previsti":"Costi reali"}</h4>{d.costs.filter(c=>c.phase===phase&&!(record.replacedCostIds||[]).includes(c.id)).map(c=><div key={c.id} style={{border:"1px solid #343941",borderRadius:8,padding:10,marginBottom:10}}><div className="profit-grid"><label>Categoria<select value={c.category} onChange={e=>update(c.id,"category",e.target.value)}>{Object.entries(PROFIT_COSTS).map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></label><label>Data<input type="date" value={c.date} onChange={e=>update(c.id,"date",e.target.value)}/></label><label>{["carrozziere","verniciatore","meccanico"].includes(c.category)?"Ore":"Quantità"}<input type="number" min="0.01" max="100000" step="0.01" value={c.quantity} onChange={e=>update(c.id,"quantity",Number(e.target.value))}/></label><label>Costo unitario / orario (€)<input type="number" min="0" max="10000000" step="0.01" value={c.unitCents/100} onChange={e=>update(c.id,"unitCents",Math.round(Number(e.target.value)*100))}/></label></div><label>Descrizione<input maxLength="250" value={c.description} onChange={e=>update(c.id,"description",e.target.value)}/></label><p>Totale: {profitEuro(Math.round(c.quantity*c.unitCents))} <button onClick={()=>change(x=>({...x,[c.phase==="actual"?"actualComplete":"plannedComplete"]:false,costs:x.costs.filter(row=>row.id!==c.id)}))}>Rimuovi voce</button></p></div>)}<button onClick={()=>add(phase)}>+ {phase==="planned"?"Costo previsto":"Costo reale"}</button><label style={{marginTop:8}}><input style={{width:18,minHeight:18}} type="checkbox" checked={d[phase==="actual"?"actualComplete":"plannedComplete"]} onChange={e=>{const checked=e.target.checked;change(x=>({...x,[phase==="actual"?"actualComplete":"plannedComplete"]:checked}));}}/> {phase==="planned"?"Budget completo (comprese categorie a costo zero)":"Tutti i costi reali sono stati registrati"}</label></div>)}
 {(record.automaticCosts||[]).length>0&&<div><h4>Ricambi automatici da Parts Tracking</h4><p className="profit-muted">Questi importi seguono i ricambi e i rimborsi confermati. Modificali nella scheda Parts Tracking. {(record.replacedCostIds||[]).length} voci manuali collegate sono conservate ma escluse dal totale per evitare duplicati.</p>{record.automaticCosts.map(c=><p key={c.id} className="profit-muted">{c.phase==="planned"?"Previsto":"Reale"} · {c.description}: <strong>{profitEuro(c.unitCents)}</strong></p>)}</div>}
 <h4>Cause dello scostamento</h4><ProfitBars rows={m.categories}/><div style={{overflowX:"auto"}}><table><thead><tr><th>Categoria</th><th>Previsto</th><th>Reale</th><th>Effetto sul margine</th></tr></thead><tbody>{[...m.categories].sort((a,b)=>a.variance-b.variance).map(c=><tr key={c.category}><td>{PROFIT_COSTS[c.category]}</td><td>{profitEuro(c.planned)}</td><td>{profitEuro(c.actual)}</td><td style={{color:c.variance<0?"#FF8679":"#58C78A"}}>{profitEuro(c.variance)}</td></tr>)}</tbody></table></div>
 <div style={{position:"sticky",bottom:0,background:"#15171B",padding:"10px 0"}}><button disabled={!dirty||busy} onClick={save}>{busy?"Salvataggio…":"Salva Profit Tracker"}</button><button disabled={busy} onClick={()=>{if(!dirty||confirm("Scartare le modifiche non salvate e ricaricare?"))load().catch(e=>setError(e.message));}}>Ricarica dati</button></div></fieldset></section>;
}
function ProfitDashboard({api,ruolo,onOpen}) {
 const [group,setGroup]=useState("month"),[from,setFrom]=useState(""),[to,setTo]=useState(""),[data,setData]=useState(null),[error,setError]=useState(""),[settings,setSettings]=useState(null),[saving,setSaving]=useState(false),[notice,setNotice]=useState("");
 const url=`/api/profit/dashboard?${new URLSearchParams({group,...(from?{from}:{}),...(to?{to}:{})})}`;
 const refresh=useCallback(async()=>{const r=await api(url);setData(r);setError("");return r;},[api,url]);
 useEffect(()=>{let active=true;setData(null);const run=()=>api(url).then(r=>{if(active){setData(r);setError("");}}).catch(e=>active&&setError(e.message));run();const id=setInterval(run,30000);return()=>{active=false;clearInterval(id);};},[api,url]);
 useEffect(()=>{api("/api/profit/settings").then(s=>setSettings({criticalBelow:s.criticalBelow,goodFrom:s.goodFrom})).catch(e=>setError(e.message));},[api]);
 const saveSettings=async()=>{setSaving(true);try{await api("/api/profit/settings",{method:"PUT",body:JSON.stringify(settings)});await refresh();setNotice("Soglie salvate");}catch(e){setError(e.message);}finally{setSaving(false);}};
 return <section className="profit-panel"><h2>Profit Tracker</h2><p className="profit-muted">Redditività per pratica · IVA esclusa · aggiornamento ogni 30 secondi. I periodi si riferiscono alla data di competenza della riparazione, non alla data di incasso.</p><div className="profit-grid"><label>Raggruppa per<select value={group} onChange={e=>setGroup(e.target.value)}>{Object.entries({day:"Giorno",week:"Settimana (da lunedì)",month:"Mese",year:"Anno",technician:"Tecnico assegnato",insurance:"Assicurazione",workType:"Tipologia lavorazione"}).map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></label><label>Dal<input type="date" value={from} onChange={e=>setFrom(e.target.value)}/></label><label>Al<input type="date" value={to} onChange={e=>setTo(e.target.value)}/></label></div>{error&&<p role="alert" className="profit-error">{error}</p>}{notice&&<p role="status">{notice}</p>}
 {data?<><ProfitNumbers m={data.totals}/><p className="profit-muted">{data.untracked} pratiche senza registro Profit Tracker escluse. {data.totals?.incomplete||0} pratiche nel periodo con dati incompleti. Le percentuali sono ponderate sui ricavi totali. Un ricavo mancante rende il margine aggregato non disponibile.</p><ProfitBars rows={data.groups.map(g=>({...g,category:g.key}))}/><div style={{overflowX:"auto"}}><table><thead><tr><th>Gruppo</th><th>Pratiche</th><th>Ricavi previsti</th><th>Costi previsti</th><th>Costi reali</th><th>Margine previsto</th><th>Margine reale</th><th>Scostamento</th></tr></thead><tbody>{data.groups.map(g=><tr key={g.key}><td>{g.label}{g.incomplete>0?" · provvisorio":""}</td><td>{g.count}</td><td>{profitEuro(g.revenue)}</td><td>{profitEuro(g.planned)}</td><td>{profitEuro(g.actual)}</td><td>{profitEuro(g.plannedMargin)} / {profitPct(g.plannedPercent)}</td><td>{{good:"🟢",watch:"🟠",critical:"🔴",unknown:"⚪"}[g.status]} {profitEuro(g.actualMargin)} / {profitPct(g.actualPercent)}</td><td>{profitEuro(g.variance)}</td></tr>)}</tbody></table></div><h3>Pratiche nel periodo</h3>{data.records.map(r=><div key={r.vehicleId} style={{padding:8,borderBottom:"1px solid #343941"}}><button onClick={()=>onOpen(r.vehicleId)}>Apri {r.label}</button> {profitEuro(r.actualMargin)} · {profitPct(r.actualPercent)} {r.provisional?"(provvisorio)":""}</div>)}</>:!error&&<p>Caricamento…</p>}
 {ruolo==="ADMIN"&&settings&&<div><h3>Soglie marginalità</h3><div className="profit-grid"><label>Critica sotto (%)<input type="number" min="0" max="99" value={settings.criticalBelow} onChange={e=>setSettings(s=>({...s,criticalBelow:Number(e.target.value)}))}/></label><label>Buona da (%)<input type="number" min="1" max="100" value={settings.goodFrom} onChange={e=>setSettings(s=>({...s,goodFrom:Number(e.target.value)}))}/></label></div><p className="profit-muted">Tra le due soglie: marginalità da controllare. Le soglie si applicano a tutta la carrozzeria.</p><button disabled={saving} onClick={saveSettings}>Salva soglie</button></div>}</section>;
}

/* ---------------- INSURANCE GAP ANALYSIS ----------------
   Confronto tra il preventivo interno e il documento ricevuto
   dall'assicurazione. Riservato ad ADMIN/AMMINISTRAZIONE (come Profit
   Tracker). L'IA propone una lettura del documento: non dichiara mai
   automaticamente una voce dovuta o corretta, l'operatore corregge e
   conferma sempre prima di generare la bozza di richiesta integrazione. */
const GAP_STATO_INFO = {
  CORRISPONDE: { emoji: "🟢", label: "Corrisponde", color: "#2F8F5B" },
  DIFFERENZA: { emoji: "🟠", label: "Differenza", color: "#C9A24B" },
  MANCANTE: { emoji: "🔴", label: "Voce mancante", color: "#B4472E" },
};

function InsuranceGapAnalysis({ vehicle, api, token }) {
  const ruolo = decodificaRuolo(token);
  const [analisi, setAnalisi] = useState([]);
  const [loading, setLoading] = useState(true);
  const [quoteId, setQuoteId] = useState(vehicle.quotes?.[0]?.id || "");
  const [analizzando, setAnalizzando] = useState(false);
  const [errore, setErrore] = useState(null);
  const [modificheLocali, setModificheLocali] = useState({});
  const [salvandoId, setSalvandoId] = useState(null);
  const [generandoPdfId, setGenerandoPdfId] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    api(`/api/vehicles/${vehicle.id}/insurance-gap`).then(setAnalisi).catch(() => {}).finally(() => setLoading(false));
  }, [api, vehicle.id]);

  useEffect(() => { if (RUOLI_CON_ACCESSO_FINANZIARIO.includes(ruolo)) load(); }, [load, ruolo]);

  if (!RUOLI_CON_ACCESSO_FINANZIARIO.includes(ruolo)) return null;

  const caricaEAnalizza = async (file) => {
    if (!file || !quoteId) return;
    setErrore(null);
    setAnalizzando(true);
    try {
      const body = new FormData();
      body.append("file", file);
      body.append("quoteId", quoteId);
      const res = await fetch(`${API}/api/vehicles/${vehicle.id}/insurance-gap/analizza`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error ? JSON.stringify(data.error) : "Errore durante l'analisi");
      setAnalisi((prev) => [data, ...prev]);
    } catch (e) {
      setErrore(e.message);
    } finally {
      setAnalizzando(false);
    }
  };

  const aggiornaCampo = (itemId, campo, valore) => {
    setModificheLocali((prev) => ({ ...prev, [itemId]: { ...(prev[itemId] || {}), [campo]: valore } }));
  };

  const salvaCorrezioni = async (item) => {
    const modifiche = modificheLocali[item.id];
    if (!modifiche) return;
    setSalvandoId(item.id);
    setErrore(null);
    try {
      const aggiornato = await api(`/api/insurance-gap-items/${item.id}`, { method: "PATCH", body: JSON.stringify(modifiche) });
      setAnalisi((prev) => prev.map((a) => ({ ...a, items: a.items.map((it) => (it.id === item.id ? aggiornato : it)) })));
      setModificheLocali((prev) => { const p = { ...prev }; delete p[item.id]; return p; });
    } catch (e) {
      setErrore(e.message);
    } finally {
      setSalvandoId(null);
    }
  };

  const toggleSuggerimento = async (s, analysisId) => {
    setErrore(null);
    try {
      await api(`/api/insurance-gap-suggestions/${s.id}`, { method: "PATCH", body: JSON.stringify({ scartata: !s.scartata }) });
      setAnalisi((prev) => prev.map((a) => (a.id === analysisId
        ? { ...a, suggerimenti: a.suggerimenti.map((x) => (x.id === s.id ? { ...x, scartata: !x.scartata } : x)) }
        : a)));
    } catch (e) {
      setErrore(e.message);
    }
  };

  const eliminaAnalisi = async (id) => {
    if (!confirm("Eliminare questa analisi? L'operazione non si può annullare.")) return;
    setErrore(null);
    try {
      await api(`/api/vehicles/${vehicle.id}/insurance-gap/${id}`, { method: "DELETE" });
      setAnalisi((prev) => prev.filter((a) => a.id !== id));
    } catch (e) {
      setErrore(e.message);
    }
  };

  const generaPdf = async (analysisId) => {
    setGenerandoPdfId(analysisId);
    setErrore(null);
    try {
      const res = await fetch(`${API}/api/vehicles/${vehicle.id}/insurance-gap/${analysisId}/richiesta-integrazione`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw new Error(d.error || "Errore durante la generazione del documento");
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `richiesta-integrazione-${vehicle.targa}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      setErrore(e.message);
    } finally {
      setGenerandoPdfId(null);
    }
  };

  return (
    <div style={{ marginTop: 26 }}>
      <h3 style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>Insurance Gap Analysis</h3>
      <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 12, lineHeight: 1.5 }}>
          Carica il preventivo o la perizia ricevuti dall'assicurazione: l'IA confronta ogni voce con il preventivo interno e segnala eventuali differenze, senza mai dichiarare automaticamente una voce dovuta o corretta.
        </div>

        {(vehicle.quotes || []).length === 0 ? (
          <div style={{ fontSize: 12, color: "#8D9099" }}>Crea prima un preventivo interno per questo veicolo per poterlo confrontare.</div>
        ) : (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
            <select value={quoteId} onChange={(e) => setQuoteId(e.target.value)} style={{
              fontSize: 12, padding: "7px 8px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", color: "#F3F1EC",
            }}>
              {vehicle.quotes.map((q) => (
                <option key={q.id} value={q.id}>Preventivo {q.id.slice(-6)} — {euro(q.totale)} ({q.stato})</option>
              ))}
            </select>
            <label style={{
              padding: "8px 14px", borderRadius: 8, border: "1.5px dashed #D9D5CA", fontSize: 12, color: "#8D9099",
              cursor: analizzando || !quoteId ? "default" : "pointer",
            }}>
              {analizzando ? "Analisi in corso…" : "Carica documento assicurazione (PDF/JPEG/PNG)"}
              <input type="file" accept="application/pdf,image/jpeg,image/png" style={{ display: "none" }}
                disabled={analizzando || !quoteId}
                onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; if (f) caricaEAnalizza(f); }} />
            </label>
          </div>
        )}

        {errore && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginBottom: 12 }}>{errore}</div>}

        {loading ? (
          <div style={{ fontSize: 12, color: "#8D9099" }}>Caricamento…</div>
        ) : analisi.map((a) => (
          <div key={a.id} style={{ border: "1px solid #2A2E34", borderRadius: 10, padding: 12, background: "#15171B", marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700 }}>{a.documentName}</div>
                <div style={{ fontSize: 11, color: "#8D9099" }}>{new Date(a.createdAt).toLocaleString("it-IT")}</div>
              </div>
              <button onClick={() => eliminaAnalisi(a.id)} style={{
                fontSize: 11, padding: "4px 8px", borderRadius: 6, border: "1px solid #2A2E34", background: "transparent", color: "#8D9099",
              }}>Elimina</button>
            </div>

            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", margin: "10px 0", fontSize: 13 }}>
              <div>Preventivo carrozzeria: <strong>{euro(a.totalePreventivoInterno)}</strong></div>
              <div>Riconosciuto assicurazione: <strong>{a.totaleRiconosciutoAssicurazione != null ? euro(a.totaleRiconosciutoAssicurazione) : "non indicato"}</strong></div>
              {a.differenza != null && (
                <div style={{ color: Number(a.differenza) > 0 ? "#B4472E" : "#2F8F5B", fontWeight: 700 }}>
                  Differenza: {Number(a.differenza) > 0 ? "-" : "+"}{euro(Math.abs(a.differenza))}
                </div>
              )}
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {a.items.map((item) => {
                const modifiche = modificheLocali[item.id] || {};
                const valore = (campo) => (campo in modifiche ? modifiche[campo] : item[campo]);
                const info = GAP_STATO_INFO[valore("stato")] || GAP_STATO_INFO.MANCANTE;
                const dirty = !!modificheLocali[item.id];
                return (
                  <div key={item.id} style={{ border: "1px solid #2A2E34", borderRadius: 8, padding: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                      <span>{info.emoji}</span>
                      <span style={{ fontSize: 12, fontWeight: 700, flex: 1, minWidth: 120 }}>{item.descrizione}</span>
                      <select value={valore("stato")} onChange={(e) => aggiornaCampo(item.id, "stato", e.target.value)} style={{
                        fontSize: 11, padding: "3px 6px", borderRadius: 6, border: "1px solid #2A2E34", background: "#0A0B0D", color: info.color, fontWeight: 600,
                      }}>
                        {Object.entries(GAP_STATO_INFO).map(([k, v]) => <option key={k} value={k}>{v.emoji} {v.label}</option>)}
                      </select>
                    </div>
                    <div style={{ fontSize: 11, color: "#8D9099", marginTop: 4 }}>
                      Preventivo carrozzeria: {Number(item.quantita)} × {euro(item.prezzoUnitario)} = {euro(Number(item.quantita) * Number(item.prezzoUnitario))}
                    </div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 11, color: "#8D9099" }}>Riconosciuto assicurazione:</span>
                      <input type="number" step="0.01" value={valore("quantitaAssicurazione") ?? ""} placeholder="qtà"
                        onChange={(e) => aggiornaCampo(item.id, "quantitaAssicurazione", e.target.value === "" ? null : Number(e.target.value))}
                        style={{ width: 56, fontSize: 11, padding: "3px 5px", borderRadius: 5, border: "1px solid #2A2E34", background: "#0A0B0D", color: "#F3F1EC" }} />
                      <span style={{ fontSize: 11, color: "#8D9099" }}>×</span>
                      <input type="number" step="0.01" value={valore("prezzoUnitarioAssicurazione") ?? ""} placeholder="prezzo"
                        onChange={(e) => aggiornaCampo(item.id, "prezzoUnitarioAssicurazione", e.target.value === "" ? null : Number(e.target.value))}
                        style={{ width: 70, fontSize: 11, padding: "3px 5px", borderRadius: 5, border: "1px solid #2A2E34", background: "#0A0B0D", color: "#F3F1EC" }} />
                      {item.descrizioneAssicurazioneAI && (
                        <span style={{ fontSize: 11, color: "#8D9099" }}>· nel documento: "{item.descrizioneAssicurazioneAI}"</span>
                      )}
                    </div>
                    {dirty && (
                      <button onClick={() => salvaCorrezioni(item)} disabled={salvandoId === item.id} style={{
                        marginTop: 8, fontSize: 11, fontWeight: 600, padding: "4px 10px", borderRadius: 6, border: "none", background: "#4E7F8C", color: "#fff",
                      }}>{salvandoId === item.id ? "Salvataggio…" : "Salva correzione"}</button>
                    )}
                  </div>
                );
              })}
            </div>

            {a.suggerimenti?.length > 0 && (
              <div style={{ marginTop: 14 }}>
                <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 4 }}>Possibili voci da verificare</div>
                <div style={{ fontSize: 11, color: "#8D9099", marginBottom: 8 }}>Non sono voci confermate: vanno valutate professionalmente prima di includerle in qualsiasi richiesta.</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {a.suggerimenti.map((s) => (
                    <div key={s.id} style={{ display: "flex", gap: 8, alignItems: "flex-start", opacity: s.scartata ? 0.5 : 1 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 12, fontWeight: 600 }}>{s.voce}</div>
                        {s.motivo && <div style={{ fontSize: 11, color: "#8D9099" }}>{s.motivo}</div>}
                      </div>
                      <button onClick={() => toggleSuggerimento(s, a.id)} style={{
                        fontSize: 10, padding: "3px 8px", borderRadius: 6, border: "1px solid #2A2E34", background: "transparent", color: "#8D9099",
                      }}>{s.scartata ? "Ripristina" : "Scarta"}</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <button onClick={() => generaPdf(a.id)} disabled={generandoPdfId === a.id} style={{
              marginTop: 14, padding: "8px 14px", borderRadius: 8, border: "none", background: "#C9A24B", color: "#15171B", fontSize: 12, fontWeight: 700,
            }}>{generandoPdfId === a.id ? "Generazione…" : "Genera richiesta integrazione"}</button>
          </div>
        ))}
      </div>
    </div>
  );
}


const DELAY_DEPTS={carrozzeria:"Carrozzeria",meccanica:"Meccanica",verniciatura:"Verniciatura",finitura:"Finitura / controllo / lavaggio"};
const delayDate=d=>d?new Date(d.length===10?d+"T12:00:00":d).toLocaleDateString("it-IT",{timeZone:"Europe/Rome"}):"Non disponibile";
function DelayResult({forecast}) {
 const r=forecast?.result;
 if(!r)return <p>Nessuna previsione disponibile. Le vetture già consegnate non generano nuove previsioni retrospettive.</p>;
 const badge={green:"🟢",orange:"🟠",red:"🔴",unknown:"⚪"}[r.band];
 return <><div className="profit-grid"><div><span className="profit-muted">Rischio ritardo</span><div style={{fontSize:28,fontWeight:700}}>{badge} {r.risk===null?"Da valutare":r.risk+"%"}</div></div><div><span className="profit-muted">Consegna promessa</span><p>{delayDate(r.promisedDate)}</p></div><div><span className="profit-muted">Nuova data stimata</span><p>{delayDate(r.estimatedDate)}</p></div></div><p className="profit-muted">🟢 0–30% · 🟠 31–60% · 🔴 61–100%<br/>{r.method}</p><h4>Fattori della previsione</h4><ul style={{paddingLeft:20,fontSize:13,lineHeight:1.7}}>{r.factors.map((f,i)=><li key={i}>{f.text}{f.points?` (${f.points>0?"+":""}${f.points} punti)`:""}</li>)}</ul>{r.missing.length>0&&<details open><summary>Dati da completare ({r.missing.length})</summary><ul style={{paddingLeft:20,fontSize:12}}>{r.missing.map((m,i)=><li key={i}>{m}</li>)}</ul></details>}<p className="profit-muted">Aggiornata: {new Date(forecast.createdAt).toLocaleString("it-IT")}{forecast.actualDeliveredAt?` · Consegna reale: ${delayDate(forecast.actualDeliveredAt)}`:""}</p></>;

 {!list.length&&<p>Nessuna fotografia presente. Puoi caricarla qui o dalla sezione Foto esistente.</p>}

 {!!list.length&&<fieldset disabled={busy||!!editing} style={{border:0,padding:0,minWidth:0}}><h4>Confronto prima / dopo</h4><div className="profit-grid">{[['Prima',before,setBefore],['Dopo',after,setAfter]].map(([label,value,set])=><label key={label}>{label}<select value={value} onChange={e=>set(e.target.value)}><option value="">Seleziona fotografia</option>{list.map(p=><option key={p.id} value={p.id}>{title(p)}</option>)}</select></label>)}</div>{a&&b&&(a.id===b.id?<p>Seleziona due fotografie diverse.</p>:<><label><input type="checkbox" checked={overlap} onChange={e=>setOverlap(e.target.checked)}/> Sovrapponi fotografie</label>{overlap?<><div style={{position:'relative',aspectRatio:'4 / 3',background:'#08090B'}}><img src={a.url} alt="Prima" style={{width:'100%',height:'100%',objectFit:'contain'}}/><img src={b.url} alt="Dopo" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'contain',opacity:blend/100}}/></div><label>Trasparenza dopo<input type="range" min="0" max="100" value={blend} onInput={e=>setBlend(Number(e.target.value))}/></label></>:<div className="smart-comparison"><div><h5>Prima</h5><SmartImage photo={a} markers={smartMeta(a).markers}/></div><div><h5>Dopo</h5><SmartImage photo={b} markers={smartMeta(b).markers}/></div></div>}<p className="profit-muted">Il confronto è scelto dall’operatore; inquadrature diverse non sono allineate automaticamente.</p></>)}
 <h4>Dossier fotografico</h4><label>Destinazione del documento<select value={audience} onChange={e=>setAudience(e.target.value)}><option value="CLIENTE">Cliente</option><option value="ASSICURAZIONE">Assicurazione</option><option value="INTERNO">Documentazione interna</option></select></label><p>{selected.length?`${selected.length} fotografie selezionate`:`Tutte le ${list.length} fotografie saranno incluse`} · massimo 80 per dossier.</p><p className="profit-muted">Include dati pratica, veicolo, date, annotazioni, lavorazioni documentate, ricambi e foto finali. Le note interne compaiono soltanto nella copia interna. Nessun invio automatico.</p><button onClick={dossier} disabled={before&&after&&(before===after||selected.length>0&&(!selected.includes(before)||!selected.includes(after)))}>Genera dossier fotografico</button>{!!selected.length&&<button onClick={()=>setSelected([])}>Includi tutte le foto</button>}{before&&after&&selected.length>0&&(!selected.includes(before)||!selected.includes(after))&&<p>Includi entrambe le foto del confronto nella selezione.</p>}</fieldset>}</>}</section>;
}

function VehicleDetailModal({ vehicleId, api, token, onClose: closeRequested, onStageChange }) {
  const [profitDirty,setProfitDirty]=useState(false);
  const [delayDirty,setDelayDirty]=useState(false);
  const [partsDirty,setPartsDirty]=useState(false);
  const [photoDirty,setPhotoDirty]=useState(false);
  const onClose=()=>{if((!profitDirty&&!delayDirty&&!partsDirty&&!photoDirty)||confirm("Scartare le modifiche non salvate della pratica?"))closeRequested();};
  const [vehicle, setVehicle] = useState(null);
  const [loading, setLoading] = useState(true);
  const [uploadingFase, setUploadingFase] = useState(null);
  const [error, setError] = useState(null);
  const [analizzando, setAnalizzando] = useState(false);
  const [erroreIA, setErroreIA] = useState(null);
  const [mostraFirmaConsegna, setMostraFirmaConsegna] = useState(false);
  const [firmandoConsegna, setFirmandoConsegna] = useState(false);
  const [erroreFirmaConsegna, setErroreFirmaConsegna] = useState(null);
  const [vediFirmaConsegna, setVediFirmaConsegna] = useState(false);
  const [linkPortale, setLinkPortale] = useState(null);
  const [generandoLink, setGenerandoLink] = useState(false);
  const [erroreLink, setErroreLink] = useState(null);

  const load = useCallback((opts = {}) => {
    if (!opts.silent) setLoading(true);
    return api(`/api/vehicles/${vehicleId}`).then(setVehicle).finally(() => {
      if (!opts.silent) setLoading(false);
    });
  }, [api, vehicleId]);

  useEffect(() => { load().catch(e => setError(e.message)); }, [load]);

  const handleFileSelected = async (fase, file) => {
    if (!file) return;
    setError(null);
    setUploadingFase(fase);
    try {
      await uploadPhoto(token, vehicleId, file, fase);
      await load();
    } catch (e) {
      setError(e.message);
    } finally {
      setUploadingFase(null);
    }
  };

  const deletePhoto = async (photoId) => {
    try {
      await api(`/api/photos/${photoId}`, { method: "DELETE" });
      load();
    } catch (e) {
      setError(e.message);
    }
  };

  const toggleVisibilitaFoto = async (photo) => {
    try {
      await api(`/api/photos/${photo.id}/visibilita`, { method: "PATCH", body: JSON.stringify({ visibilePortale: !photo.visibilePortale }) });
      load({ silent: true });
    } catch (e) {
      setError(e.message);
    }
  };

  const numeroFotoPrima = (vehicle?.photos || []).filter((p) => p.fase === "PRIMA").length;

  const analizzaDanni = async () => {
    setErroreIA(null);
    setAnalizzando(true);
    try {
      const updated = await api(`/api/vehicles/${vehicleId}/analizza-danni`, { method: "POST" });
      setVehicle(updated);
    } catch (e) {
      setErroreIA(e.message);
    } finally {
      setAnalizzando(false);
    }
  };

  const salvaFirmaConsegna = async (firmaDataUrl, firmatarioNome) => {
    setErroreFirmaConsegna(null);
    setFirmandoConsegna(true);
    try {
      const updated = await api(`/api/vehicles/${vehicleId}/firma-consegna`, {
        method: "POST",
        body: JSON.stringify({ firmaDataUrl, firmatarioNome }),
      });
      setVehicle(updated);
      setMostraFirmaConsegna(false);
      onStageChange();
    } catch (e) {
      setErroreFirmaConsegna(e.message);
    } finally {
      setFirmandoConsegna(false);
    }
  };
  const generaLinkPortale = async () => {
    setErroreLink(null);
    setGenerandoLink(true);
    try {
      const res = await api(`/api/portale/genera/${vehicleId}`, { method: "POST" });
      setLinkPortale(res.token);
    } catch (e) {
      setErroreLink(e.message);
    } finally {
      setGenerandoLink(false);
    }
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, background: "rgba(27,26,23,0.5)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50,
    }}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: "#15171B", borderRadius: 16, width: 640, maxWidth: "95vw", maxHeight: "85vh", overflowY: "auto", padding: 24,
      }}>
        {loading || !vehicle ? <Loading /> : (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
              <div>
                <div style={{ fontFamily: "monospace", fontSize: 12, background: "#1B1E23", color: "#C9A24B", border: "1px solid #2A2E34", display: "inline-block", padding: "2px 7px", borderRadius: 5 }}>{vehicle.targa}</div>
                <h2 style={{ fontSize: 19, fontWeight: 700, margin: "8px 0 2px" }}>{vehicle.marca} {vehicle.modello}</h2>
                <div style={{ fontSize: 13, color: "#8D9099" }}>{vehicle.client?.nome} {vehicle.client?.cognome}</div>
              </div>
              <button onClick={onClose} style={{
                border: "none", background: "#F1EFE8", width: 28, height: 28, borderRadius: 8, fontSize: 15, color: "#4A4842",
              }}>✕</button>
            </div>

            {error && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 13, padding: 10, borderRadius: 8, marginTop: 12 }}>{error}</div>}

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 24, marginBottom: 10 }}>Foto</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
              {FASI.map((fase) => {
                const photosInFase = (vehicle.photos || []).filter((p) => p.fase === fase.key);
                return (
                  <div key={fase.key}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: "#4A4842", marginBottom: 6 }}>{fase.label}</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      {photosInFase.map((p) => (
                        <div key={p.id} style={{ position: "relative" }}>
                          <img src={p.url} alt={fase.label} style={{ width: "100%", height: 90, objectFit: "cover", borderRadius: 8, border: "1px solid #2A2E34", opacity: p.visibilePortale === false ? 0.45 : 1 }} />
                          <button disabled={photoDirty} onClick={() => deletePhoto(p.id)} style={{
                            position: "absolute", top: 4, right: 4, width: 20, height: 20, borderRadius: 6, border: "none",
                            background: "rgba(27,26,23,0.7)", color: "#15171B", fontSize: 11, lineHeight: 1,
                          }}>✕</button>
                          <button
                            title={p.visibilePortale === false ? "Nascosta dal portale cliente: clicca per mostrarla" : "Visibile nel portale cliente: clicca per nasconderla"}
                            disabled={photoDirty} onClick={() => toggleVisibilitaFoto(p)} style={{
                            position: "absolute", top: 4, left: 4, width: 20, height: 20, borderRadius: 6, border: "none",
                            background: "rgba(27,26,23,0.7)", color: p.visibilePortale === false ? "#8D9099" : "#C9A24B", fontSize: 11, lineHeight: 1,
                          }}>{p.visibilePortale === false ? "🙈" : "👁"}</button>
                        </div>
                      ))}
                      <label style={{
                        display: "flex", alignItems: "center", justifyContent: "center", height: 44, borderRadius: 8,
                        border: "1.5px dashed #D9D5CA", fontSize: 12, color: "#8D9099", cursor: "pointer",
                      }}>
                        {uploadingFase === fase.key ? "Caricamento…" : "+ Aggiungi foto"}
                        <input
                          type="file"
                          accept="image/*"
                          capture="environment"
                          style={{ display: "none" }}
                          disabled={uploadingFase !== null||photoDirty}
                          onChange={(e) => handleFileSelected(fase.key, e.target.files[0])}
                        />
                      </label>
                    </div>
                  </div>
                );
              })}
            </div>

            <SmartPhotoTimeline vehicleId={vehicle.id} api={api} photos={vehicle.photos} onPhotosChanged={load} onDirtyChange={setPhotoDirty} />
            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>Stima danni IA</h3>
            <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
              {numeroFotoPrima === 0 ? (
                <div style={{ fontSize: 12, color: "#8D9099" }}>Carica almeno una foto "Prima" per poter avviare l'analisi.</div>
              ) : (
                <>
                  <button onClick={analizzaDanni} disabled={analizzando} style={{
                    padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B",
                    fontSize: 13, fontWeight: 600, marginBottom: vehicle.stimaIA ? 14 : 0,
                  }}>
                    {analizzando ? "Analisi in corso…" : vehicle.stimaIA ? "Rianalizza foto" : "Analizza foto con IA"}
                  </button>

                  {erroreIA && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginTop: 10 }}>{erroreIA}</div>}

                  {vehicle.stimaIA && (
                    <div>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                        {(() => {
                          const sev = vehicle.stimaIA.severita;
                          const sevColor = sev === "grave" ? "#B4472E" : sev === "moderata" ? "#C9A24B" : "#2F8F5B";
                          return (
                            <span style={{
                              fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20,
                              background: sevColor + "22", color: sevColor, textTransform: "capitalize",
                            }}>{sev || "n/d"}</span>
                          );
                        })()}
                        <span style={{ fontSize: 18, fontWeight: 700 }}>
                          {euro(vehicle.stimaIA.costoStimatoMin)} – {euro(vehicle.stimaIA.costoStimatoMax)}
                        </span>
                      </div>

                      {vehicle.stimaIA.areeDanneggiate?.length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
                          {vehicle.stimaIA.areeDanneggiate.map((area, i) => (
                            <span key={i} style={{ fontSize: 11, background: "#F1EFE8", color: "#4A4842", padding: "3px 9px", borderRadius: 20 }}>{area}</span>
                          ))}
                        </div>
                      )}

                      {vehicle.stimaIA.descrizione && (
                        <p style={{ fontSize: 13, color: "#4A4842", margin: "0 0 10px", lineHeight: 1.5 }}>{vehicle.stimaIA.descrizione}</p>
                      )}

                      {vehicle.stimaIA.noteAlPerito && (
                        <div style={{ fontSize: 12, color: "#8D9099", background: "#15171B", border: "1px solid #2A2E34", borderRadius: 8, padding: 10 }}>
                          <strong>Note per il perito: </strong>{vehicle.stimaIA.noteAlPerito}
                        </div>
                      )}

                      {vehicle.stimaIAAt && (
                        <div style={{ fontSize: 11, color: "#8D9099", marginTop: 10 }}>
                          Analisi generata il {new Date(vehicle.stimaIAAt).toLocaleString("it-IT")} — stima preliminare da foto, non sostituisce il perito.
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </div>

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>AI Damage Assistant</h3>
            <AiDamageAssistant vehicle={vehicle} api={api} token={token} onVehicleReload={load} />
            <PartsPanel vehicleId={vehicle.id} api={api} onDirtyChange={setPartsDirty} />
            <DelayPanel vehicleId={vehicle.id} api={api} clientPhone={vehicle.client?.telefono} onDirtyChange={setDelayDirty} />

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>Lavorazioni (Modalità Tecnico)</h3>
            <WorkOrdersPanel vehicleId={vehicle.id} api={api} ruolo={decodificaRuolo(token)} />

            {["ADMIN","AMMINISTRAZIONE"].includes(decodificaRuolo(token)) && <ProfitTracker vehicleId={vehicle.id} api={api} onDirtyChange={setProfitDirty} />}
            <InsuranceGapAnalysis vehicle={vehicle} api={api} token={token} />

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>Comunicazioni WhatsApp</h3>
            <WhatsappPanel vehicleId={vehicle.id} api={api} />

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>Controllo Qualità (QC)</h3>
            <QcPanel vehicleId={vehicle.id} api={api} ruolo={decodificaRuolo(token)} />

            <h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>Consegna e firma</h3>
            <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>
              {vehicle.firmaConsegnaDataUrl ? (
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                    <span style={{
                      fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20,
                      background: "#2F8F5B22", color: "#2F8F5B",
                    }}>✓ Consegnato e firmato</span>
                  </div>
                  <div style={{ fontSize: 12, color: "#8D9099", marginBottom: 10 }}>

                    padding: "7px 12px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 12, fontWeight: 600,

                  padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600,
                }}>Firma e consegna veicolo</button>

<h3 style={{ fontSize: 13, fontWeight: 700, marginTop: 26, marginBottom: 10 }}>Portale cliente</h3>
            <div style={{ background: "#0A0B0D", border: "1px solid #2A2E34", borderRadius: 12, padding: 16 }}>

                    <input readOnly value={`https://carrozzeria-crm-backend-production.up.railway.app/portale/?t=${linkPortale}`} style={{
                      flex: 1, fontSize: 12, padding: "8px 10px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B",
                    }} onClick={(e) => e.target.select()} />
                    <button onClick={() => navigator.clipboard.writeText(`https://carrozzeria-crm-backend-production.up.railway.app/portale/?t=${linkPortale}`)} style={{
                      padding: "8px 12px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 12, fontWeight: 600,
                    }}>Copia</button>
                    <button onClick={async () => { if (!confirm("Revocare il link? Il cliente non potrà più accedere alla pratica con questo link.")) return; await api(`/api/portale/revoca/${vehicleId}`, { method: "POST" }); setLinkPortale(null); }} style={{
                      padding: "8px 12px", borderRadius: 8, border: "1px solid #B4472E", background: "#15171B", color: "#E5806B", fontSize: 12, fontWeight: 600,
                    }}>Revoca</button>
                  </div>
                </div>
              ) : (
                <button onClick={generaLinkPortale} disabled={generandoLink} style={{
                  padding: "8px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13, fontWeight: 600,
                }}>{generandoLink ? "Generazione…" : "Genera link cliente"}</button>
              )}
              {erroreLink && <div style={{ background: "#FBEAE5", color: "#B4472E", fontSize: 12, padding: 10, borderRadius: 8, marginTop: 10 }}>{erroreLink}</div>}

      </div>

      {mostraFirmaConsegna && (
        <FirmaModal
          titolo="Firma consegna veicolo"

          salvando={firmandoConsegna}
          errore={erroreFirmaConsegna}
          onSalva={salvaFirmaConsegna}
          onAnnulla={() => setMostraFirmaConsegna(false)}
        />
      )}

      {vediFirmaConsegna && (
        <VisualizzaFirmaModal
          firmaDataUrl={vehicle.firmaConsegnaDataUrl}
          firmatario={vehicle.firmatarioConsegna}
          quando={vehicle.dataFirmaConsegna}
          onClose={() => setVediFirmaConsegna(false)}
        />
      )}
    </div>
  );
}

function NewVehicleForm({ clients, api, onDone, onCancel }) {
  const [form, setForm] = useState({ clientId: clients[0]?.id || "", marca: "", modello: "", targa: "" });
  const [error, setError] = useState(null);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const submit = async () => {
    try {
      await api("/api/vehicles", { method: "POST", body: JSON.stringify(form) });
      onDone();
    } catch (e) { setError(e.message); }
  };

  return (
    <div style={{ background: "#15171B", border: "1px solid #2A2E34", borderRadius: 12, padding: 16, marginBottom: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
        <select value={form.clientId} onChange={set("clientId")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }}>
          {clients.length === 0 && <option value="">Crea prima un cliente</option>}
          {clients.map((c) => <option key={c.id} value={c.id}>{c.nome} {c.cognome}</option>)}
        </select>
        <input placeholder="Marca" value={form.marca} onChange={set("marca")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
        <input placeholder="Modello" value={form.modello} onChange={set("modello")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
        <input placeholder="Targa" value={form.targa} onChange={set("targa")} style={{ padding: 8, borderRadius: 8, border: "1px solid #2A2E34" }} />
      </div>
      {error && <div style={{ color: "#B4472E", fontSize: 12, marginTop: 8 }}>{error}</div>}
      <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#F3F1EC", color: "#15171B", fontSize: 13 }}>Salva</button>
        <button onClick={onCancel} style={{ padding: "7px 14px", borderRadius: 8, border: "1px solid #2A2E34", background: "#15171B", fontSize: 13 }}>Annulla</button>
      </div>
    </div>
  );
}
